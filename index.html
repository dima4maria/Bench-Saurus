   REPORTS  (spending by week, month, person)
   ========================================================= */
let repRange='all';     // all | year | d90 | d30
let repBasis='placed';  // placed | all
let repChartUnit='month'; // month | week
function repAmount(o){ return (Number(o.qty)||0)*(Number(o.unit)||0); }
function repInRange(ds){
  if(repRange==='all'||!ds) return true;
  const d=new Date(ds+'T00:00:00'); if(isNaN(d)) return true;
  const now=new Date();
  if(repRange==='year') return d.getFullYear()===now.getFullYear();
  const days=(now-d)/86400000;
  if(repRange==='d90') return days<=90 && days>=-1;
  if(repRange==='d30') return days<=30 && days>=-1;
  return true;
}
function repOrders(){
  return S.orders.filter(o=>{
    if(o.status==='cancelled') return false;
    if(repBasis==='placed' && o.status==='requested') return false;
    return repInRange(o.date);
  });
}
function weekStartKey(ds){
  const d=new Date(ds+'T00:00:00'); if(isNaN(d)) return ds;
  const day=(d.getDay()+6)%7; // Monday=0
  d.setDate(d.getDate()-day);
  return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
}
function monthKey(ds){ return (ds||'').slice(0,7); }
function groupSum(orders,keyFn){
  const m={};
  orders.forEach(o=>{ const k=keyFn(o)||'—'; if(!m[k]) m[k]={sum:0,n:0}; m[k].sum+=repAmount(o); m[k].n++; });
  return m;
}
function barRow(label,value,max,sub){
  const pct=max>0?Math.max(2,Math.round(value/max*100)):0;
  return `<div class="rep-row">
    <div class="rep-label">${esc(label)}${sub?` <span class="tiny muted">${esc(sub)}</span>`:''}</div>
    <div class="rep-track"><div class="rep-fill" style="width:${pct}%"></div></div>
    <div class="rep-val">${money(value)}</div>
  </div>`;
}
function renderReports(){
  const orders=repOrders();
  const total=orders.reduce((s,o)=>s+repAmount(o),0);
  const pendingList=S.orders.filter(o=>o.status==='requested' && repInRange(o.date));
  const pending=pendingList.reduce((s,o)=>s+repAmount(o),0);
  const avg=orders.length?total/orders.length:0;

  const byMonth=groupSum(orders,o=>monthKey(o.date));
  const byPerson=groupSum(orders,o=>o.reqBy||'Unspecified');
  const byWeek=groupSum(orders,o=>weekStartKey(o.date));

  const monthKeys=Object.keys(byMonth).sort();              // chronological
  const personKeys=Object.keys(byPerson).sort((a,b)=>byPerson[b].sum-byPerson[a].sum);
  const weekKeys=Object.keys(byWeek).sort().slice(-12);     // last 12 weeks in range
  const mMax=Math.max(1,...monthKeys.map(k=>byMonth[k].sum));
  const pMax=Math.max(1,...personKeys.map(k=>byPerson[k].sum));
  const wMax=Math.max(1,...weekKeys.map(k=>byWeek[k].sum));

  $('#content').innerHTML=`
  <div class="section-head">
    <select onchange="repRange=this.value;renderReports()">
      <option value="all" ${repRange==='all'?'selected':''}>All time</option>
      <option value="year" ${repRange==='year'?'selected':''}>This year</option>
      <option value="d90" ${repRange==='d90'?'selected':''}>Last 90 days</option>
      <option value="d30" ${repRange==='d30'?'selected':''}>Last 30 days</option>
    </select>
    <select onchange="repBasis=this.value;renderReports()">
      <option value="placed" ${repBasis==='placed'?'selected':''}>Placed orders</option>
      <option value="all" ${repBasis==='all'?'selected':''}>All incl. requested</option>
    </select>
    <span class="spacer"></span>
    <button class="btn ghost sm" onclick="exportSpendCSV()">⬇ CSV</button>
  </div>
  <p class="tiny muted" style="margin:-6px 2px 14px">Spend is quantity times unit price. ${repBasis==='placed'?'Counting orders that were placed (ordered, received, or backordered).':'Counting all orders including not-yet-placed requests.'} Cancelled orders are always excluded.</p>

  <div class="grid stats" style="margin-bottom:18px">
    ${statCard('green','Total spend',money(total),`${orders.length} order${orders.length===1?'':'s'}`,DINO.bronto())}
    ${statCard('sky','Average / order',money(avg),'across the range',DINO.rex())}
    ${statCard('sun','Pending requests',money(pending),`${pendingList.length} waiting to place`,DINO.egg())}
    ${statCard('coral','People ordering',personKeys.length,'in this range',DINO.stego())}
  </div>

  <div class="card pad-lg" style="margin-bottom:16px">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">
      <h3 style="margin:0">📈 Spending over time</h3>
      <span class="spacer" style="flex:1"></span>
      <div class="viewtoggle">
        <button class="vt ${repChartUnit==='month'?'on':''}" onclick="repChartUnit='month';renderReports()">Monthly</button>
        <button class="vt ${repChartUnit==='week'?'on':''}" onclick="repChartUnit='week';renderReports()">Weekly</button>
      </div>
    </div>
    ${timeChartSVG(buildSeries(orders,repChartUnit))}
  </div>

  <div class="set-grid" style="align-items:start">
    <div class="card pad-lg">
      <h3>🧑‍🔬 By person</h3>
      ${personKeys.length? personKeys.map(k=>barRow(k,byPerson[k].sum,pMax,`${byPerson[k].n} order${byPerson[k].n===1?'':'s'}`)).join('') : '<p class="tiny muted">No spend in this range.</p>'}
    </div>
    <div class="card pad-lg">
      <h3>🗓️ By week ${weekKeys.length?'<span class="tiny muted">· most recent 12</span>':''}</h3>
      ${weekKeys.length? weekKeys.map(k=>barRow('Week of '+fmtDate(k),byWeek[k].sum,wMax,`${byWeek[k].n} order${byWeek[k].n===1?'':'s'}`)).join('') : '<p class="tiny muted">No spend in this range.</p>'}
    </div>
  </div>`;
}
function niceMax(v){ if(v<=0) return 1; const pow=Math.pow(10,Math.floor(Math.log10(v))); const n=v/pow; let m; if(n<=1)m=1; else if(n<=2)m=2; else if(n<=2.5)m=2.5; else if(n<=5)m=5; else m=10; return m*pow; }
function shortMoney(n){ n=Math.round(n); if(n>=1000){ const k=n/1000; return '$'+(k>=10?Math.round(k):(Math.round(k*10)/10))+'k'; } return '$'+n; }
function addMonths(k,d){ const y=+k.slice(0,4), m=+k.slice(5,7)-1; const x=new Date(y,m+d,1); return `${x.getFullYear()}-${pad2(x.getMonth()+1)}`; }
function monthSeqBetween(a,b){ const out=[]; let k=a; let guard=0; while(k<=b && guard++<240){ out.push(k); k=addMonths(k,1);} return out; }
function weekSeqBetween(a,b){ const out=[]; let d=new Date(a+'T00:00:00'); const end=new Date(b+'T00:00:00'); let guard=0; while(d<=end && guard++<520){ out.push(`${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`); d.setDate(d.getDate()+7);} return out; }
function monthShortLabel(k,multiYear){ const d=new Date(k+'-01T00:00:00'); const mo=d.toLocaleString('en-US',{month:'short'}); return multiYear? `${mo} '${String(d.getFullYear()).slice(2)}` : mo; }
function weekShortLabel(k){ const d=new Date(k+'T00:00:00'); return `${d.getMonth()+1}/${d.getDate()}`; }
function buildSeries(orders,unit){
  const by=groupSum(orders, unit==='month'? o=>monthKey(o.date) : o=>weekStartKey(o.date));
  const keys=Object.keys(by).filter(Boolean).sort();
  if(!keys.length) return [];
  const seq = unit==='month'? monthSeqBetween(keys[0],keys[keys.length-1]) : weekSeqBetween(keys[0],keys[keys.length-1]);
  const multiYear = unit==='month' && keys[0].slice(0,4)!==keys[keys.length-1].slice(0,4);
  return seq.map(k=>({key:k, label: unit==='month'? monthShortLabel(k,multiYear) : weekShortLabel(k), value: by[k]?by[k].sum:0, n: by[k]?by[k].n:0}));
}
function timeChartSVG(series){
  if(!series.length) return '<p class="tiny muted">No spend in this range yet.</p>';
  const W=760,H=280,padL=58,padR=14,padT=16,padB=40;
  const plotW=W-padL-padR, plotH=H-padT-padB, n=series.length;
  const maxV=niceMax(Math.max(...series.map(s=>s.value),0));
  const band=plotW/n, bw=Math.max(6,Math.min(46,band*0.62));
  const x=i=>padL+band*i+(band-bw)/2;
  const y=v=>padT+plotH*(1-(maxV?v/maxV:0));
  let grid='';
  const G=4;
  for(let i=0;i<=G;i++){ const gv=maxV*i/G, gy=y(gv); grid+=`<line x1="${padL}" y1="${gy.toFixed(1)}" x2="${W-padR}" y2="${gy.toFixed(1)}" stroke="var(--line-2)" stroke-width="1"/><text x="${padL-8}" y="${(gy+4).toFixed(1)}" text-anchor="end" class="ax">${shortMoney(gv)}</text>`; }
  const labelEvery=Math.ceil(n/14);
  let bars='';
  series.forEach((s,i)=>{
    const bh=s.value>0?Math.max(2,plotH*(s.value/maxV)):0, by=padT+plotH-bh;
    bars+=`<g><title>${esc(s.label)}: ${money(s.value)} · ${s.n} order${s.n===1?'':'s'}</title><rect x="${x(i).toFixed(1)}" y="${by.toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" rx="5" fill="var(--green)"/></g>`;
    if(i%labelEvery===0) bars+=`<text x="${(x(i)+bw/2).toFixed(1)}" y="${H-padB+18}" text-anchor="middle" class="ax">${esc(s.label)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" class="rep-chart" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Spending over time">${grid}${bars}</svg>`;
}
function exportSpendCSV(){
  const orders=repOrders();
  const rows=[['Date','Week of','Month','Person','Item','Vendor','Qty','Unit price','Amount','Status']];
  orders.slice().sort((a,b)=>(a.date||'').localeCompare(b.date||'')).forEach(o=>{
    rows.push([o.date||'',weekStartKey(o.date||''),monthKey(o.date||''),o.reqBy||'Unspecified',o.item||'',vendorName(o.vendor)||'',o.qty||0,o.unit||0,repAmount(o).toFixed(2),o.status||'']);
  });
  download('spending_'+todayKey()+'.csv',toCSV(rows)); toast('Spending report downloaded','good');
}

function isManager(){

  const mgrEmail=(S.settings.managerEmail||'').trim().toLowerCase();

  const email=(CLOUD && _session && _session.user ? (_session.user.email||'') : '').trim().toLowerCase();
  if(mgr && (me===mgr || cur===mgr)) return true;

function isAdmin(){
  // The only identity signal trusted here is the actual signed-in Supabase Auth email —
  // never a typed name (whoAmI()/currentUserName()), since those are freely editable by
  // anyone with the app open. It's checked against two things:
  //  1) TRUSTED_ADMIN_EMAILS above (fixed, source-only — e.g. the app's builder)
  //  2) whatever email is currently set as "Lab manager email" in Settings, so admin
  //     access automatically follows whoever holds that role without a code change.
  // Note: because (2) reads from Settings, it is only as safe as that field — anyone who
  // finds this logic in the page source could set their own signed-in email as the
  // "Lab manager email" to grant themselves access. It isn't shown or hinted at in the UI,
  // but it isn't hidden from the source either, since this is a plain, unminified HTML file.
  if(!CLOUD || !_session || !_session.user) return false;
  const email=(_session.user.email||'').trim().toLowerCase();
  if(!email) return false;
  if(TRUSTED_ADMIN_EMAILS.some(e=>e.trim().toLowerCase()===email)) return true;
  const mgrEmail=(S.settings.managerEmail||'').trim().toLowerCase();
  return !!(mgrEmail && email===mgrEmail);
}

let _g=null;
function cactusSVG(){return `<svg viewBox="0 0 24 36" style="width:100%;height:100%"><g fill="#3DBE74"><rect x="9" y="5" width="6" height="31" rx="3"/><rect x="2" y="15" width="5" height="13" rx="2.5"/><rect x="17" y="11" width="5" height="15" rx="2.5"/></g></svg>`;}
function openDinoGame(){
  if(_gameOpen) return; _gameOpen=true; eggFound('game');
  const best=Number(localStorage.getItem('labbench_dino_best')||0);
  const ov=document.createElement('div'); ov.id='dinoGame'; ov.className='dino-game';
  ov.innerHTML=`<div class="dg-panel">
    <button class="dg-x" onclick="closeDinoGame()" aria-label="Close">×</button>
    <div class="dg-head"><span class="dg-title">🦕 Dino Dash</span><span class="spacer" style="flex:1"></span><span>Score <b id="dgScore">0</b></span><span class="dg-best">Best <b id="dgBest">${best}</b></span></div>
    <div class="dg-stage" id="dgStage" tabindex="0">
      <div class="dg-cloud" style="top:18px;left:60%"></div><div class="dg-cloud" style="top:40px;left:30%;transform:scale(.7)"></div>
      <div class="dg-ground"></div>
      <div class="dg-player" id="dgPlayer">${DINO.trex()}</div>
      <div class="dg-start" id="dgStart">Tap or press Space to jump 🦖<br><span class="tiny">jump the cacti</span></div>
    </div>
    <div class="dg-hint">Space or tap to jump · it speeds up · Esc to quit</div>
  </div>`;
  document.body.appendChild(ov);
  const stage=document.getElementById('dgStage');
  _g={ stage, player:document.getElementById('dgPlayer'), w:stage.clientWidth, h:stage.clientHeight,
       y:0, vy:0, grounded:true, started:false, running:true, over:false,
       speed:300, score:0, obs:[], nextGap:0, last:0, ground:30, psize:48 };
  ov.addEventListener('mousedown',gameJump); ov.addEventListener('touchstart',e=>{e.preventDefault();gameJump();},{passive:false});
  document.addEventListener('keydown',gameKeys,true);
  _g.raf=requestAnimationFrame(gameLoop);
}
function gameKeys(e){
  if(!_gameOpen) return;
  if(e.key===' '||e.key==='ArrowUp'||e.key==='Spacebar'){ e.preventDefault(); gameJump(); }
  else if(e.key==='Escape'){ e.preventDefault(); closeDinoGame(); }
}
function gameJump(){
  if(!_g||_g.over){ if(_g&&_g.over) restartDinoGame(); return; }
  if(_g.grounded){ _g.vy=660; _g.grounded=false; _g.started=true; const s=document.getElementById('dgStart'); if(s)s.style.display='none'; }
}
function spawnObs(){
  const el=document.createElement('div'); el.className='dg-cactus';
  const scale=0.8+Math.random()*0.7, w=22*scale, hh=34*scale;
  el.style.cssText=`width:${w}px;height:${hh}px`; el.innerHTML=cactusSVG();
  _g.stage.appendChild(el);
  _g.obs.push({el, x:_g.w+10, w, h:hh});
}
function gameLoop(t){
  if(!_g||!_g.running) return;
  const dt=Math.min(0.05,(t-(_g.last||t))/1000); _g.last=t;
  if(_g.started){
    // physics
    _g.vy-=2000*dt; _g.y+=_g.vy*dt; if(_g.y<=0){_g.y=0;_g.vy=0;_g.grounded=true;}
    _g.player.style.transform=`translateY(${-_g.y}px)`;
    // speed + score
    _g.speed=300+_g.score*0.9; _g.score+=dt*22; document.getElementById('dgScore').textContent=Math.floor(_g.score);
    // spawn
    _g.nextGap-=_g.speed*dt;
    if(_g.nextGap<=0){ spawnObs(); _g.nextGap=170+Math.random()*200; }
    // move + collide
    const px=34, pw=_g.psize-16, pb=_g.y;
    for(let i=_g.obs.length-1;i>=0;i--){ const o=_g.obs[i]; o.x-=_g.speed*dt; o.el.style.transform=`translateX(${o.x}px)`;
      if(o.x+o.w < px || o.x > px+pw){} // x overlap check below
      const xOverlap = (o.x < px+pw) && (o.x+o.w > px+4);
      if(xOverlap && pb < o.h-6){ return gameOver(); }
      if(o.x+o.w < -20){ o.el.remove(); _g.obs.splice(i,1); }
    }
  }
  _g.raf=requestAnimationFrame(gameLoop);
}
function gameOver(){
  _g.over=true; _g.running=false;
  const best=Math.max(Number(localStorage.getItem('labbench_dino_best')||0),Math.floor(_g.score));
  try{ localStorage.setItem('labbench_dino_best',best); }catch(e){}
  const bestEl=document.getElementById('dgBest'); if(bestEl) bestEl.textContent=best;
  const s=document.getElementById('dgStart'); if(s){ s.style.display='block'; s.innerHTML=`💥 Ouch! Score ${Math.floor(_g.score)}<br><span class="tiny">Tap or Space to play again</span>`; }
}
function restartDinoGame(){
  _g.obs.forEach(o=>o.el.remove());
  Object.assign(_g,{y:0,vy:0,grounded:true,started:false,running:true,over:false,speed:300,score:0,obs:[],nextGap:0,last:0});
  _g.player.style.transform='translateY(0)'; document.getElementById('dgScore').textContent='0';
  const s=document.getElementById('dgStart'); if(s){ s.style.display='block'; s.innerHTML='Tap or press Space to jump 🦖<br><span class="tiny">jump the cacti</span>'; }
  cancelAnimationFrame(_g.raf); _g.raf=requestAnimationFrame(gameLoop);
}
function closeDinoGame(){
  _gameOpen=false; if(_g){ _g.running=false; cancelAnimationFrame(_g.raf); }
  document.removeEventListener('keydown',gameKeys,true);
  const ov=document.getElementById('dinoGame'); if(ov) ov.remove(); _g=null;
}

  openModal(`<div class="modal-head"><span style="width:30px">${done?DINO.trex('#FFDD66','#E3A92C'):DINO.egg()}</span><h3>Egg collection · ${done?'🏆 ':''}${f.length}/${total}</h3><button class="x" onclick="closeModal()">×</button></div>
    <div class="modal-body">
      ${done?`<div class="award-banner"><span class="aw-dino">${DINO.trex('#FFDD66','#E3A92C')}</span><div style="flex:1"><b>Golden Dino Award</b><div class="tiny muted">You found all ${total}. Legendary paleontologist.</div></div><button class="btn sm primary" onclick="goldenDinoAward()">Replay</button></div>`:'<p class="tiny muted">Hidden dinosaur surprises you\'ve discovered on this device. Keep exploring to fill the nest. 🦕</p>'}
      <div class="egg-list">${rows}</div>
    </div>
    <div class="modal-foot"><button class="btn primary" onclick="closeModal()">${done?'🦕 Roar of approval':'Keep hunting'}</button></div>`);
}
function barrelRoll(){ const app=document.querySelector('.app'); if(!app)return; app.classList.remove('barrel'); void app.offsetWidth; app.classList.add('barrel'); setTimeout(()=>app.classList.remove('barrel'),1050); toast('🦕 Do a barrel roll!','good'); eggFound('roll'); }
function jurassicNod(){
  eggFound('jurassic'); toast('🦕 Welcome… to Lab Bench Park.','good');
  const l=eggLayer(); const el=document.createElement('div'); el.className='party-dino';
  el.style.cssText='width:88px;height:88px;top:58vh;animation-duration:7.5s'; el.innerHTML=DINO.brachio(); l.appendChild(el);
  setTimeout(()=>el.remove(),7700);
}
function coffeeEgg(){ eggFound('coffee'); toast('☕ Lab fuel detected — 99% of breakthroughs happen right here.','good'); }
let _trackOn=false, _trackHandler=null;
function dinoTracks(){
  eggFound('tracks'); if(_trackOn) return; _trackOn=true; toast('🐾 Follow the tracks…','good');
  const l=eggLayer(); let last=0;
  _trackHandler=(e)=>{ const now=Date.now(); if(now-last<110) return; last=now;
    const f=document.createElement('div'); f.className='track-print'; f.style.left=(e.clientX-11)+'px'; f.style.top=(e.clientY-7)+'px';
    f.innerHTML=DINO.prints(); l.appendChild(f); setTimeout(()=>f.remove(),1400); };
  document.addEventListener('mousemove',_trackHandler);
  setTimeout(()=>{ _trackOn=false; if(_trackHandler){ document.removeEventListener('mousemove',_trackHandler); _trackHandler=null; } },5500);
}

function supaHost(){ try{ return new URL(SUPA_URL).host; }catch(e){ return SUPA_URL||''; } }

/* =========================================================
   AUTH GATE  (real security: data is locked by Supabase RLS)
   ========================================================= */
let _session=null, _booted=false, _rtSubbed=false;
async function init(){
  $('#brandDino').innerHTML=DINO.bronto();
  $('#walker').innerHTML=DINO.trex();
  initEasterEggs();
  if(!CLOUD){ await boot(); return; }   // local test mode, no login needed
  sb.auth.onAuthStateChange((event,session)=>{
    _session=session;
    if(event==='PASSWORD_RECOVERY'){ showRecovery(); return; }
    if(event==='SIGNED_OUT' || !session){ _booted=false; showLogin(); }
  });
  try{
    const { data }=await sb.auth.getSession();
    _session=data.session;
  }catch(e){ console.error(e); }
  if(_session){ await boot(); } else { showLogin(); }
}
async function boot(){
  if(_booted) return; _booted=true;
  hideAuth();
  $('#signoutBtn').style.display = CLOUD? '' : 'none';
  if(CLOUD && _session){ $('#footUser').style.display=''; $('#footUser').textContent=_session.user.email||''; }
  await load();
  applyChrome();
  initEmailJS();
  if(CLOUD && !_rtSubbed){ subscribeRealtime(); _rtSubbed=true; }
  buildNav();
  navigate('dashboard');
  if(!tourDone()) setTimeout(startFullTour,900);   // first-ever sign-in: walk through every tab once
}
function hideAuth(){ const o=$('#authOverlay'); o.style.display='none'; o.innerHTML=''; }
function showLogin(msg){
  $('#signoutBtn').style.display='none'; $('#footUser').style.display='none';
  const o=$('#authOverlay'); o.style.display='flex';
  o.innerHTML=`
    <div class="auth-card">
      <div class="alogo floaty">${DINO.brachio()}</div>
      <h2>Lab Bench</h2>
      <div class="asub">Lab sign in</div>
      <div class="field"><label class="tiny" style="font-weight:800">Email</label>
        <input id="au_email" type="email" autocomplete="username" placeholder="you@uni.edu" onkeydown="if(event.key==='Enter')doLogin()"></div>
      <div class="field"><label class="tiny" style="font-weight:800">Password</label>
        <input id="au_pass" type="password" autocomplete="current-password" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()"></div>
      <button class="btn primary" onclick="doLogin()">Sign in</button>
      <div class="auth-msg ${msg?'err':''}" id="au_msg">${msg||''}</div>
      <button class="auth-link" onclick="doReset()">Forgot password?</button>
    </div>`;
  setTimeout(()=>{ const e=$('#au_email'); if(e) e.focus(); },50);
}
async function doLogin(){
  const email=($('#au_email').value||'').trim();
  const password=$('#au_pass').value||'';
  if(!email||!password){ authMsg('Enter your email and password','err'); return; }
  authMsg('Signing in…','');
  try{
    const { error }=await sb.auth.signInWithPassword({email,password});
    if(error){ authMsg(error.message||'Could not sign in','err'); return; }
    const { data }=await sb.auth.getSession();
    _session=data.session;
    await boot();
  }catch(e){ authMsg('Could not reach the server','err'); }
}
async function doReset(){
  const email=($('#au_email').value||'').trim();
  if(!email){ authMsg('Type your email first, then tap reset','err'); return; }
  try{
    await sb.auth.resetPasswordForEmail(email,{redirectTo:location.href.split('#')[0]});
    authMsg('Check your email for a reset link','ok');
  }catch(e){ authMsg('Could not send a reset email','err'); }
}
function authMsg(t,k){ const m=$('#au_msg'); if(m){ m.textContent=t; m.className='auth-msg '+(k||''); } }
function showRecovery(){
  const o=$('#authOverlay'); o.style.display='flex';
  o.innerHTML=`
    <div class="auth-card">
      <div class="alogo floaty">${DINO.egg()}</div>
      <h2>Set a new password</h2>
      <div class="asub">Almost there</div>
      <div class="field"><label class="tiny" style="font-weight:800">New password</label>
        <input id="au_new" type="password" autocomplete="new-password" placeholder="at least 6 characters" onkeydown="if(event.key==='Enter')doSetPass()"></div>
      <button class="btn primary" onclick="doSetPass()">Save password</button>
      <div class="auth-msg" id="au_msg"></div>
    </div>`;
  setTimeout(()=>{ const e=$('#au_new'); if(e) e.focus(); },50);
}
async function doSetPass(){
  const pw=$('#au_new').value||'';
  if(pw.length<6){ authMsg('Use at least 6 characters','err'); return; }
  try{
    const { error }=await sb.auth.updateUser({password:pw});
    if(error){ authMsg(error.message||'Could not update','err'); return; }
    const { data }=await sb.auth.getSession(); _session=data.session;
    await boot();
  }catch(e){ authMsg('Something went wrong','err'); }
}
async function signOut(){
  try{ await sb.auth.signOut(); }catch(e){}
  _booted=false; _session=null;
  $('#content').innerHTML='';
  showLogin();
}
document.addEventListener('keydown',e=>{ if(e.key==='Escape')closeModal(); });
init();
</script>
