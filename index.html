<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Lab Bench · Lab Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* ============ TOKENS ============ */
:root{
  --cream:#FBF6EA;
  --cream-2:#F3ECDA;
  --paper:#FFFFFF;
  --ink:#23332A;
  --muted:#6E7D71;
  --line:#E7DFCC;
  --line-2:#EFE8D7;

  --green:#2FA866;
  --green-d:#1F7A48;
  --green-l:#D8F0E0;
  --leaf:#3DBE74;

  --coral:#FF7A59;
  --coral-d:#E55a3a;
  --coral-l:#FFE2D8;

  --sun:#FFC53D;
  --sun-l:#FFF0CC;

  --sky:#54B6E6;
  --sky-l:#DAF0FB;

  --plum:#A07CD6;
  --plum-l:#ECE3F9;

  --radius:18px;
  --radius-sm:12px;
  --radius-lg:26px;
  --shadow:0 10px 30px rgba(40,60,45,.10);
  --shadow-sm:0 4px 14px rgba(40,60,45,.08);
  --ring:0 0 0 4px rgba(47,168,102,.22);

  --font-display:"Fredoka", system-ui, sans-serif;
  --font-body:"Nunito", system-ui, sans-serif;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--font-body);
  color:var(--ink);
  background:var(--cream);
  background-image:radial-gradient(circle at 12% 18%, rgba(84,182,230,.06), transparent 38%),
                   radial-gradient(circle at 88% 8%, rgba(255,197,61,.10), transparent 40%),
                   radial-gradient(circle at 78% 92%, rgba(47,168,102,.07), transparent 42%);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:600;margin:0;letter-spacing:.1px}
a{color:var(--green-d)}
button{font-family:var(--font-body);cursor:pointer}
:focus-visible{outline:none;box-shadow:var(--ring);border-radius:10px}

/* ============ SHELL ============ */
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.app.collapsed{grid-template-columns:0 1fr}
.app.collapsed .sidebar{transform:translateX(-100%);transition:transform .22s}
.sidebar{
  background:var(--paper);
  border-right:2px solid var(--line);
  padding:18px 14px;
  position:sticky;top:0;height:100vh;
  display:flex;flex-direction:column;gap:6px;
  z-index:20;overflow:hidden;
}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 14px}
.brand .logo{width:46px;height:46px;flex:none}
.brand .word{font-family:var(--font-display);font-weight:700;font-size:21px;line-height:1;color:var(--ink)}
.brand .word small{display:block;font-family:var(--font-body);font-weight:700;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--green-d);margin-top:3px}

.nav{display:flex;flex-direction:column;gap:4px;margin-top:4px}
.nav button{
  display:flex;align-items:center;gap:11px;
  border:none;background:transparent;text-align:left;
  padding:11px 12px;border-radius:14px;font-weight:700;font-size:14.5px;color:var(--ink);
  transition:background .15s, transform .12s;
}
.nav button .ic{width:22px;height:22px;flex:none;display:grid;place-items:center}
.nav button:hover{background:var(--cream-2)}
.nav button.active{background:var(--green-l);color:var(--green-d)}
.nav button.active .ic svg{transform:scale(1.06)}
.nav .count{margin-left:auto;background:var(--coral);color:#fff;font-size:11px;font-weight:800;padding:1px 8px;border-radius:999px}

.side-foot{margin-top:auto;padding:10px 8px 4px;border-top:2px dashed var(--line);}
.side-foot .lab-name{font-family:var(--font-display);font-weight:600;font-size:14px}
.side-foot .mgr{font-size:12px;color:var(--muted)}
.walkstrip{height:34px;position:relative;overflow:hidden;margin-top:6px}
.walker{position:absolute;bottom:0;left:-60px;width:46px;animation:walk 14s linear infinite}
.walker svg{display:block;animation:bob .5s ease-in-out infinite}

/* ============ MAIN ============ */
.main{min-width:0;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:15;
  background:rgba(251,246,234,.86);backdrop-filter:blur(8px);
  border-bottom:2px solid var(--line);
  padding:16px 26px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
}
.topbar .hgroup{display:flex;align-items:center;gap:12px;min-width:0}
.topbar h1{font-size:23px}
.topbar .sub{color:var(--muted);font-size:13px;font-weight:600}
.topbar .spacer{flex:1}
.menu-toggle{display:inline-flex}

.content{padding:24px 26px 80px;max-width:1280px;width:100%;margin-inline:auto}
@media(min-width:1500px){.content{padding:30px 40px 90px}.section-head{margin-bottom:18px}}

/* ============ BUTTONS ============ */
.btn{
  border:2px solid transparent;border-radius:13px;padding:9px 15px;font-weight:800;font-size:13.5px;
  display:inline-flex;align-items:center;gap:7px;background:var(--paper);color:var(--ink);
  transition:transform .12s, box-shadow .15s, background .15s;box-shadow:var(--shadow-sm);
}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn svg{width:16px;height:16px}
.btn.primary{background:var(--green);color:#fff;box-shadow:0 8px 18px rgba(47,168,102,.30)}
.btn.primary:hover{background:var(--green-d)}
.btn.ghost{background:transparent;border-color:var(--line);box-shadow:none}
.btn.ghost:hover{background:var(--cream-2)}
.btn.coral{background:var(--coral);color:#fff;box-shadow:0 8px 18px rgba(255,122,89,.30)}
.btn.coral:hover{background:var(--coral-d)}
.btn.sky{background:var(--sky);color:#fff}
.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:11px}
.btn.icon{padding:8px;border-radius:11px}
.btn.block{width:100%;justify-content:center}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none}

.urgent-switch{display:inline-flex;align-items:center;gap:7px;cursor:pointer;user-select:none;padding:4px 2px}
.urgent-switch input{position:absolute;opacity:0;width:1px;height:1px}
.urgent-switch-track{position:relative;width:36px;height:21px;background:var(--line);border-radius:999px;transition:background .18s ease;flex-shrink:0}
.urgent-switch-thumb{position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(40,60,45,.35);transition:transform .18s ease}
.urgent-switch input:checked + .urgent-switch-track{background:var(--coral)}
.urgent-switch input:checked + .urgent-switch-track .urgent-switch-thumb{transform:translateX(15px)}
.urgent-switch input:focus-visible + .urgent-switch-track{box-shadow:var(--ring)}
.urgent-switch-label{font-size:12px;font-weight:800;color:var(--muted);white-space:nowrap}
.urgent-switch input:checked ~ .urgent-switch-label{color:var(--coral-d)}

/* ============ CARDS / STATS ============ */
.row{display:flex;gap:16px;flex-wrap:wrap}
.grid{display:grid;gap:16px}
.stats{grid-template-columns:repeat(4,1fr)}
.card{
  background:var(--paper);border:2px solid var(--line-2);border-radius:var(--radius);
  box-shadow:var(--shadow-sm);padding:18px;
}
.card.pad-lg{padding:22px}
.card h3{font-size:16px;display:flex;align-items:center;gap:8px}
.stat{position:relative;overflow:hidden}
.stat .lab{font-size:12.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.stat .num{font-family:var(--font-display);font-weight:700;font-size:34px;line-height:1.1;margin-top:6px}
.stat .hint{font-size:12.5px;color:var(--muted);font-weight:600;margin-top:2px}
.stat .deco{position:absolute;right:-6px;bottom:-10px;width:74px;opacity:.5}
.stat.green{background:linear-gradient(160deg,#fff, var(--green-l))}
.stat.coral{background:linear-gradient(160deg,#fff, var(--coral-l))}
.stat.sun{background:linear-gradient(160deg,#fff, var(--sun-l))}
.stat.sky{background:linear-gradient(160deg,#fff, var(--sky-l))}

.section-head{display:flex;align-items:center;gap:12px;margin:6px 2px 14px;flex-wrap:wrap}
.section-head h2{font-size:19px}
.section-head .spacer{flex:1}
.toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center}

/* ============ TABLE ============ */
.tablewrap{overflow-x:auto;border-radius:var(--radius);border:2px solid var(--line-2);background:var(--paper);box-shadow:var(--shadow-sm)}
table{border-collapse:collapse;width:100%;min-width:640px}
thead th{
  text-align:left;font-family:var(--font-body);font-weight:800;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;
  color:var(--muted);padding:13px 14px;background:var(--cream-2);border-bottom:2px solid var(--line);white-space:nowrap;
}
tbody td{padding:12px 14px;border-bottom:1px solid var(--line-2);font-size:14px;vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:#FCFAF3}
td .strong{font-weight:800}
td .sub{font-size:12px;color:var(--muted);font-weight:600}
.rowact{display:flex;gap:6px;flex-wrap:wrap;align-items:center;justify-content:flex-end}

/* ============ PILLS ============ */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:800;padding:3px 10px;border-radius:999px;white-space:nowrap}
.pill .dot{width:7px;height:7px;border-radius:50%}
.pill.requested{background:var(--sun-l);color:#9a6b00}
.pill.approved{background:var(--plum-l);color:#6a45a8}
.pill.ordered{background:var(--sky-l);color:#1d6f9c}
.pill.received{background:var(--green-l);color:var(--green-d)}
.pill.backordered{background:var(--coral-l);color:var(--coral-d)}
.pill.cancelled{background:#eee;color:#888}
.pill.cat{background:var(--plum-l);color:#6a45a8}
.pill.urgent{background:var(--coral);color:#fff}
.pill.low{background:var(--coral-l);color:var(--coral-d)}
.status-select{appearance:none;-webkit-appearance:none;border:none;cursor:pointer;font:inherit;font-size:12px;font-weight:800;padding:4px 22px 4px 11px;border-radius:999px;white-space:nowrap;min-width:116px;text-align:left;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 24 24' fill='none' stroke='%23666' stroke-width='3'><path d='M6 9l6 6 6-6'/></svg>");
  background-repeat:no-repeat;background-position:right 7px center}
.status-select.requested{background-color:var(--sun-l);color:#9a6b00}
.status-select.approved{background-color:var(--plum-l);color:#6a45a8}
.status-select.ordered{background-color:var(--sky-l);color:#1d6f9c}
.status-select.received{background-color:var(--green-l);color:var(--green-d)}
.status-select.backordered{background-color:var(--coral-l);color:var(--coral-d)}
.status-select.cancelled{background-color:#eee;color:#888}
.status-select:focus{outline:2px solid var(--green);outline-offset:1px}
.status-select option{background:#fff;color:var(--ink)}
.pill.ok{background:var(--green-l);color:var(--green-d)}
.pill.exp{background:var(--coral-l);color:var(--coral-d)}
.pill.UniversityOrderPortal{background:var(--green-l);color:var(--green-d)}
.pill.ext{background:var(--sky-l);color:#1d6f9c}

/* ============ FORMS ============ */
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:13px}
.field label{font-weight:800;font-size:12.5px;color:var(--ink)}
.field .help{font-size:11.5px;color:var(--muted);font-weight:600}
input,select,textarea{
  font-family:var(--font-body);font-size:14px;color:var(--ink);
  border:2px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;width:100%;
  transition:border-color .15s, box-shadow .15s;
}
input:focus,select:focus,textarea:focus{border-color:var(--green);box-shadow:var(--ring);outline:none}
textarea{resize:vertical;min-height:70px}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.search{position:relative}
.search input{padding-left:34px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
.check{display:flex;align-items:center;gap:9px;font-weight:700;font-size:13.5px;padding:8px 0}
.check input{width:auto}

/* ============ MODAL ============ */
.modal-bg{position:fixed;inset:0;background:rgba(35,51,42,.42);backdrop-filter:blur(3px);display:none;align-items:flex-start;justify-content:center;z-index:60;padding:36px 16px;overflow-y:auto}
.modal-bg.show{display:flex}
.modal{background:var(--paper);border-radius:var(--radius-lg);width:100%;max-width:560px;box-shadow:0 30px 70px rgba(20,40,25,.30);border:2px solid var(--line);animation:pop .22s ease}
.modal.wide{max-width:720px}
.modal-head{display:flex;align-items:center;gap:10px;padding:18px 22px;border-bottom:2px solid var(--line-2)}
.modal-head h3{font-size:18px}
.modal-head .x{margin-left:auto;border:none;background:var(--cream-2);width:34px;height:34px;border-radius:50%;font-size:18px;display:grid;place-items:center;color:var(--ink)}
.modal-head .x:hover{background:var(--coral-l);color:var(--coral-d)}
.modal-body{padding:20px 22px}
.modal-foot{padding:16px 22px;border-top:2px solid var(--line-2);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}

/* ============ TOAST ============ */
.toasts{position:fixed;right:18px;bottom:18px;z-index:90;display:flex;flex-direction:column;gap:10px}
.toast{
  background:var(--ink);color:#fff;padding:12px 16px 12px 14px;border-radius:14px;font-weight:700;font-size:13.5px;
  box-shadow:0 12px 30px rgba(0,0,0,.25);display:flex;align-items:center;gap:10px;max-width:340px;animation:slidein .25s ease;
}
.toast.good{background:var(--green-d)}
.toast.warn{background:var(--coral-d)}
.toast .ti{width:24px;height:24px;flex:none}

/* ============ BANNER ============ */
.banner{
  display:flex;align-items:center;gap:14px;padding:14px 18px;border-radius:var(--radius);margin-bottom:18px;
  background:linear-gradient(120deg,var(--sun-l),#fff);border:2px solid #f1dca0;box-shadow:var(--shadow-sm);
}
.banner.green{background:linear-gradient(120deg,var(--green-l),#fff);border-color:#bfe6cd}
.banner .bimg{width:52px;flex:none}
.banner .bt{font-weight:800;font-size:14.5px}
.banner .bs{font-size:13px;color:var(--muted);font-weight:600}
.banner .spacer{flex:1}

/* ============ EMPTY ============ */
.empty{text-align:center;padding:44px 20px;color:var(--muted)}
.empty img,.empty svg{width:120px;margin-bottom:10px}
.empty .et{font-family:var(--font-display);font-weight:600;font-size:18px;color:var(--ink)}
.empty .es{font-size:13.5px;margin-top:4px}

/* ============ ACTIVITY ============ */
.feed{display:flex;flex-direction:column;gap:2px}
.feed-item{display:flex;gap:12px;padding:11px 6px;border-bottom:1px solid var(--line-2)}
.feed-item:last-child{border-bottom:none}
.feed-ic{width:34px;height:34px;border-radius:11px;flex:none;display:grid;place-items:center;background:var(--cream-2)}
.feed-ic svg{width:18px;height:18px}
.feed-main .ft{font-weight:700;font-size:13.5px}
.feed-main .ft b{font-weight:800}
.feed-main .fm{font-size:12px;color:var(--muted);font-weight:600;margin-top:1px}

/* ============ SETTINGS ============ */
.set-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chip{display:inline-flex;align-items:center;gap:7px;background:var(--cream-2);border:2px solid var(--line);border-radius:999px;padding:5px 8px 5px 12px;font-weight:700;font-size:13px}
.chip button{border:none;background:transparent;color:var(--muted);font-size:15px;line-height:1;padding:0 2px}
.chip button:hover{color:var(--coral-d)}
.addline{display:flex;gap:8px;margin-top:10px}
.addline input{flex:1}
.muted{color:var(--muted)}
.tiny{font-size:12px}
hr.soft{border:none;border-top:2px dashed var(--line);margin:18px 0}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line-2);font-size:13.5px}
.kv:last-child{border-bottom:none}
.kv b{font-weight:800}

/* link button in tables */
.linkbtn{display:inline-flex;align-items:center;gap:5px;font-weight:800;font-size:12.5px;color:var(--green-d);text-decoration:none;background:var(--green-l);padding:5px 9px;border-radius:10px}
.linkbtn:hover{background:#c6e8d2}
.linkbtn.ext{color:#1d6f9c;background:var(--sky-l)}
.linkbtn.ext:hover{background:#c5e6f7}

/* ============ ANIMATIONS ============ */
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes walk{0%{left:-60px}100%{left:calc(100% + 20px)}}
@keyframes pop{0%{transform:scale(.94);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes slidein{0%{transform:translateX(40px);opacity:0}100%{transform:translateX(0);opacity:1}}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.7);opacity:.4}}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-9px) rotate(2deg)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes wag{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(6deg)}}
.floaty{animation:floaty 5s ease-in-out infinite}
.dino-hover{transition:transform .2s}
.dino-hover:hover{transform:rotate(-4deg) scale(1.05)}

/* decorative floating dinos on dashboard */
.float-dino{position:absolute;width:64px;opacity:.85;pointer-events:none}

/* ============ RESPONSIVE ============ */
@media(max-width:1080px){.stats{grid-template-columns:repeat(2,1fr)}}
@media(max-width:900px){
  .app{grid-template-columns:1fr}
  .sidebar{
    position:fixed;left:0;top:0;width:264px;transform:translateX(-100%);transition:transform .25s;
    box-shadow:0 0 0 100vw rgba(0,0,0,0);
  }
  .sidebar.open{transform:translateX(0);box-shadow:0 0 0 100vw rgba(0,0,0,.35)}
  .menu-toggle{display:inline-flex}
  .content{padding:18px 16px 90px}
  .set-grid{grid-template-columns:1fr}
  .field-row,.field-row-3{grid-template-columns:1fr}
}
@media(max-width:560px){
  .stats{grid-template-columns:1fr}
  .topbar{padding:14px 16px}
  .topbar h1{font-size:20px}
}
@media(prefers-reduced-motion:reduce){
  *{animation:none !important;transition:none !important}
}
/* ---- lab notices (dashboard) ---- */
.notices{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.notice{display:flex;align-items:flex-start;gap:12px;background:var(--nbg);border:1.5px solid var(--nc);border-radius:16px;padding:14px 16px}
.notice .nemoji{font-size:22px;line-height:1.1;flex:none}
.notice .nmain{flex:1;min-width:0}
.notice .ntitle{font-weight:800;color:var(--nink);font-size:15px}
.notice .nbody{color:var(--ink);font-size:14px;margin-top:2px;white-space:pre-wrap;word-break:break-word}
.notice .nmeta{font-size:12px;color:var(--muted);font-weight:700;margin-top:4px}
.notice .nactions{display:flex;flex-direction:column;gap:6px;flex:none}
.notice .btn{flex:none;background:rgba(255,255,255,.6)}
/* ---- comment threads ---- */
.thread-btn{position:relative}
.thread-btn.has{color:var(--green-d);border-color:var(--green)}
.thread-btn .tc{position:absolute;top:-6px;right:-6px;background:var(--coral);color:#fff;font-size:10px;font-weight:800;border-radius:9px;min-width:16px;height:16px;line-height:16px;text-align:center;padding:0 3px}
.cmt-list{display:flex;flex-direction:column;gap:10px;max-height:300px;overflow:auto}
.cmt{background:var(--cream-2);border-radius:12px;padding:10px 12px}
.cmt-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:3px}
.cmt-b{font-size:14px;white-space:pre-wrap;word-break:break-word}
.pager{display:flex;align-items:center;gap:12px;padding:14px 4px 4px}
.pager .btn[disabled]{opacity:.4;pointer-events:none}
/* ---- auth gate ---- */
.auth-overlay{position:fixed;inset:0;z-index:200;background:radial-gradient(120% 120% at 50% 0%, #FFFDF7 0%, var(--cream) 55%, var(--cream-2) 100%);display:flex;align-items:center;justify-content:center;padding:20px}
.auth-card{width:100%;max-width:380px;background:var(--paper);border:1.5px solid var(--line);border-radius:24px;box-shadow:0 24px 60px rgba(40,60,45,.14);padding:30px 26px;text-align:center}
.auth-card .alogo{width:84px;margin:0 auto 6px}
.auth-card h2{font-family:Fredoka;font-size:24px;margin:2px 0}
.auth-card .asub{color:var(--muted);font-weight:600;font-size:13px;margin-bottom:18px}
.auth-card .field{text-align:left;margin-bottom:12px}
.auth-card input{width:100%}
.auth-card .btn{width:100%;justify-content:center;margin-top:4px}
.auth-msg{font-size:13px;font-weight:700;margin:10px 0 0;min-height:18px}
.auth-msg.err{color:var(--coral-d)}
.auth-msg.ok{color:var(--green-d)}
.auth-link{background:none;border:none;color:var(--green-d);font-weight:800;cursor:pointer;font-size:12.5px;margin-top:12px}
.side-foot .signout{margin-top:10px;width:100%;justify-content:center}
.side-foot .who{font-size:11.5px;color:var(--muted);font-weight:700;margin-top:8px;word-break:break-all}
.vnote{font-size:13px;color:var(--ink);background:var(--cream-2);border-radius:10px;padding:8px 10px;margin-top:8px;white-space:pre-wrap;word-break:break-word}
/* ---- view toggle ---- */
.viewtoggle{display:inline-flex;background:var(--cream-2);border:1.5px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.viewtoggle .vt{border:none;background:none;font:inherit;font-weight:800;font-size:13px;color:var(--muted);padding:6px 14px;border-radius:9px;cursor:pointer}
.viewtoggle .vt.on{background:var(--paper);color:var(--green-d);box-shadow:0 1px 3px rgba(40,60,45,.12)}
/* ---- calendar ---- */
.cal-wrap{background:var(--paper);border:1.5px solid var(--line);border-radius:18px;padding:14px}
.cal-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.cal-title{font-family:Fredoka;font-size:18px;font-weight:600;min-width:160px;text-align:center}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-dow{margin-bottom:6px}
.cal-dowcell{text-align:center;font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:2px 0}
.cal-cell{min-height:92px;border:1.5px solid var(--line-2);border-radius:12px;padding:6px;display:flex;flex-direction:column;gap:4px;background:var(--cream)}
.cal-cell.empty{background:transparent;border-color:transparent}
.cal-cell.today{border-color:var(--green);box-shadow:inset 0 0 0 1px var(--green)}
.cal-d{font-size:12px;font-weight:800;color:var(--muted)}
.cal-cell.today .cal-d{color:var(--green-d)}
.cal-ev{text-align:left;border:none;cursor:pointer;font:inherit;font-size:11px;line-height:1.2;font-weight:700;color:#fff;background:var(--green);border-radius:7px;padding:3px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-ev b{font-weight:800}
.cal-ev.past{background:#B8C2BB}
@media(max-width:680px){
  .cal-cell{min-height:64px;padding:4px}
  .cal-ev{font-size:10px;padding:2px 4px}
  .cal-title{min-width:120px;font-size:16px}
}
/* ---- reports ---- */
.rep-row{display:grid;grid-template-columns:1fr 120px auto;align-items:center;gap:12px;padding:7px 0;border-bottom:1px solid var(--line-2)}
.rep-row:last-child{border-bottom:none}
.rep-label{font-weight:700;font-size:13.5px}
.rep-track{height:10px;background:var(--cream-2);border-radius:6px;overflow:hidden}
.rep-fill{height:100%;background:var(--green);border-radius:6px}
.rep-val{font-weight:800;font-size:13.5px;text-align:right;min-width:84px}
.rep-chart{width:100%;height:auto;display:block;margin-top:6px}
.rep-chart .ax{fill:var(--muted);font-size:11px;font-weight:700;font-family:Nunito}
.rep-chart rect{transition:opacity .12s}
.rep-chart g:hover rect{opacity:.82}
/* ---- animated dinos ---- */
.d-walk{animation:dWalkBob .72s ease-in-out infinite;transform-box:fill-box;transform-origin:60% 80%}
.d-leg-a{transform-box:fill-box;transform-origin:50% 0;animation:dLegA .72s ease-in-out infinite}
.d-leg-b{transform-box:fill-box;transform-origin:50% 0;animation:dLegB .72s ease-in-out infinite}
.d-fly{animation:dFloat 1.7s ease-in-out infinite}
.d-wing-a{transform-box:fill-box;transform-origin:90% 60%;animation:dWingL .5s ease-in-out infinite}
.d-wing-b{transform-box:fill-box;transform-origin:10% 60%;animation:dWingR .5s ease-in-out infinite}
@keyframes dWalkBob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-2px) rotate(-1.5deg)}}
@keyframes dLegA{0%,100%{transform:rotate(9deg)}50%{transform:rotate(-11deg)}}
@keyframes dLegB{0%,100%{transform:rotate(-11deg)}50%{transform:rotate(9deg)}}
@keyframes dFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes dWingL{0%,100%{transform:rotate(2deg)}50%{transform:rotate(-22deg)}}
@keyframes dWingR{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(22deg)}}
/* ---- sidebar dino scene ---- */
.dino-scene{position:relative;height:46px;margin-top:8px;overflow:hidden}
.egg-badge{display:inline-block;margin-top:6px;font-size:11.5px;font-weight:800;color:var(--muted);background:var(--cream-2);border:1.5px solid var(--line);border-radius:999px;padding:3px 10px;cursor:pointer;user-select:none;transition:transform .12s,background .15s}
.egg-badge:hover{background:var(--sun-l);color:#9a6b00;transform:translateY(-1px)}
.dino-scene .walk-dino{position:absolute;bottom:0;left:-44px;width:52px;height:46px;animation:dCross 9s linear infinite}
@keyframes dCross{0%{left:-44px;transform:scaleX(1)}48%{left:calc(100% - 8px);transform:scaleX(1)}50%{left:calc(100% - 8px);transform:scaleX(-1)}98%{left:-44px;transform:scaleX(-1)}100%{left:-44px;transform:scaleX(1)}}
/* ---- dashboard flying dino ---- */
.dash-sky{position:relative;height:44px;overflow:hidden;margin:-2px 0 6px}
.dash-sky .fly-dino{position:absolute;top:2px;left:-58px;width:58px;height:42px;animation:dFlyCross 30s linear infinite}
@keyframes dFlyCross{0%{left:-58px;transform:scaleX(1)}47%{left:calc(100% - 6px);transform:scaleX(1)}50%{left:calc(100% - 6px);transform:scaleX(-1)}97%{left:-58px;transform:scaleX(-1)}100%{left:-58px;transform:scaleX(1)}}
/* ---- easter eggs ---- */
.egg-layer{position:fixed;inset:0;pointer-events:none;z-index:400;overflow:hidden}
.party-dino{position:fixed;left:-13vw;animation:partyCross linear forwards}
.party-dino.fly{animation-name:partyFly}
@keyframes partyCross{from{transform:translateX(0)}to{transform:translateX(128vw)}}
@keyframes partyFly{0%{transform:translateX(0) translateY(0)}25%{transform:translateX(32vw) translateY(-16px)}50%{transform:translateX(64vw) translateY(6px)}75%{transform:translateX(96vw) translateY(-14px)}100%{transform:translateX(128vw) translateY(0)}}
.confetti-egg{position:fixed;top:-7vh;animation:eggFall linear forwards}
@keyframes eggFall{0%{transform:translateY(0) rotate(0)}100%{transform:translateY(114vh) rotate(400deg)}}
.roar-text{position:fixed;top:36%;left:50%;font-family:Fredoka;font-weight:700;font-size:13vw;color:var(--coral);text-shadow:0 6px 0 rgba(0,0,0,.07);white-space:nowrap;animation:roarPop 1.5s ease forwards}
@keyframes roarPop{0%{transform:translate(-50%,-50%) scale(.4) rotate(-6deg);opacity:0}20%{transform:translate(-50%,-50%) scale(1.08) rotate(-3deg);opacity:1}70%{opacity:1}100%{transform:translate(-50%,-50%) scale(1.3);opacity:0}}
.brand{position:relative;user-select:none}
.dino-bubble{position:absolute;left:54px;top:100%;margin-top:8px;background:var(--ink);color:#fff;font-size:12px;font-weight:700;line-height:1.3;padding:8px 12px;border-radius:12px;max-width:190px;z-index:60;box-shadow:0 10px 24px rgba(0,0,0,.20);animation:bubbleIn .24s ease}
.dino-bubble::before{content:'';position:absolute;top:-6px;left:18px;border:6px solid transparent;border-bottom-color:var(--ink);border-top:none}
.dino-bubble.out{opacity:0;transition:opacity .3s}
@keyframes bubbleIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
@keyframes brandWiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-13deg)}75%{transform:rotate(13deg)}}
/* ---- hidden mini-game ---- */
.dino-game{position:fixed;inset:0;z-index:500;background:rgba(35,51,42,.45);display:flex;align-items:center;justify-content:center;padding:18px;backdrop-filter:blur(2px)}
.dg-panel{width:100%;max-width:620px;background:var(--paper);border-radius:22px;border:1.5px solid var(--line);box-shadow:0 30px 70px rgba(0,0,0,.3);padding:16px;position:relative}
.dg-x{position:absolute;top:10px;right:12px;border:none;background:var(--cream-2);width:32px;height:32px;border-radius:50%;font-size:20px;cursor:pointer;color:var(--ink);z-index:2}
.dg-head{display:flex;align-items:center;gap:14px;font-size:14px;font-weight:700;color:var(--ink);margin:2px 4px 10px}
.dg-title{font-family:Fredoka;font-size:18px}
.dg-best{color:var(--muted)}
.dg-stage{position:relative;height:230px;background:linear-gradient(180deg,#EAF6FF 0%,#F7FBEE 70%,#FBF6EA 100%);border-radius:16px;overflow:hidden;cursor:pointer;outline:none}
.dg-ground{position:absolute;left:0;right:0;bottom:0;height:30px;background:var(--cream-2);border-top:3px solid var(--line)}
.dg-player{position:absolute;left:34px;bottom:30px;width:48px;height:48px;will-change:transform}
.dg-cactus{position:absolute;left:0;bottom:30px;will-change:transform}
.dg-cloud{position:absolute;width:46px;height:16px;background:#fff;border-radius:20px;opacity:.8;box-shadow:14px -6px 0 -2px #fff,-12px -3px 0 -3px #fff}
.dg-start{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;color:var(--ink);text-align:center;gap:4px;background:rgba(255,255,255,.35)}
.dg-start .tiny{font-weight:700;color:var(--muted)}
.dg-hint{text-align:center;font-size:12px;color:var(--muted);font-weight:700;margin-top:10px}
@media(max-width:560px){.dg-stage{height:190px}}
/* ---- more egg styles ---- */
.peek-dino{position:fixed;bottom:-74px;width:66px;height:66px;z-index:399;pointer-events:none;animation:peekUpDown 4.3s ease forwards}
@keyframes peekUpDown{0%{transform:translateY(0)}16%{transform:translateY(-74px)}25%{transform:translateY(-62px)}34%{transform:translateY(-74px)}82%{transform:translateY(-74px)}100%{transform:translateY(34px)}}
.meteor{position:fixed;z-index:600;top:-30px;left:88%;width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,var(--sun) 72%);box-shadow:0 0 22px 9px rgba(255,197,61,.85);animation:meteorFly 1.5s cubic-bezier(.4,.1,.7,1) forwards}
.meteor::before{content:'';position:absolute;left:12px;top:6px;width:150px;height:6px;border-radius:6px;background:linear-gradient(90deg,rgba(255,197,61,0),rgba(255,255,255,.92));transform-origin:left center;transform:rotate(-40deg)}
@keyframes meteorFly{0%{top:-30px;left:88%;opacity:0}10%{opacity:1}88%{opacity:1}100%{top:102%;left:-12%;opacity:0}}
.app.barrel{animation:barrelRoll 1s ease}
@keyframes barrelRoll{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.app.shake{animation:appShake .5s ease}
@keyframes appShake{0%,100%{transform:translate(0,0)}20%{transform:translate(-3px,2px)}40%{transform:translate(3px,-2px)}60%{transform:translate(-2px,-2px)}80%{transform:translate(2px,2px)}}
@keyframes dgSpin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.track-print{position:fixed;width:24px;height:15px;opacity:.7;pointer-events:none;z-index:399;animation:trackFade 1.4s ease forwards}
@keyframes trackFade{0%{opacity:.7;transform:scale(.8)}100%{opacity:0;transform:scale(1.15)}}
.walker-hop svg{transform-origin:50% 100%;animation:walkerHop .5s ease}
@keyframes walkerHop{0%{transform:translateY(0) scale(1)}45%{transform:translateY(-6px) scale(1.12)}100%{transform:translateY(0) scale(1)}}
.fall-bit{position:fixed;top:-7vh;z-index:401;pointer-events:none;line-height:1;animation:eggFall linear forwards}
.float-bit{position:fixed;z-index:401;pointer-events:none;line-height:1;animation:floatUp ease-out forwards}
@keyframes floatUp{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(-72vh);opacity:0}}
.egg-flash{position:fixed;inset:0;z-index:398;pointer-events:none;opacity:.5;animation:flashFade .9s ease forwards}
@keyframes flashFade{0%{opacity:.5}100%{opacity:0}}
.ec-egg{position:absolute;width:34px;height:42px;cursor:pointer;z-index:2}
.ec-egg.ec-pop{animation:ecPop .16s ease forwards}
@keyframes ecPop{to{transform:scale(1.6);opacity:0}}
.egg-list{max-height:46vh;overflow:auto;margin-top:6px}
.dup-banner{background:linear-gradient(180deg,#fff4e0,#ffe9c7);border:1.5px solid #f0cf8f}
.dup-group{border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:12px;background:var(--paper)}
.dup-head{font-weight:800;font-size:13px;color:var(--muted);margin-bottom:8px}
.dup-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px dashed var(--line)}
.dup-row:first-of-type{border-top:none}
.dup-row>div:first-child{flex:1;min-width:0}
.dup-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}
/* center scenes + sparks */
.center-scene{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:600;pointer-events:none}
.center-scene>*{animation:scenePop 2.4s ease forwards}
@keyframes scenePop{0%{transform:scale(.6);opacity:0}14%{transform:scale(1.05);opacity:1}82%{opacity:1}100%{transform:scale(1.12);opacity:0}}
.spark{position:fixed;width:12px;height:12px;border-radius:50%;z-index:600;pointer-events:none;animation:sparkFly .9s ease-out forwards}
@keyframes sparkFly{from{transform:translate(0,0);opacity:1}to{transform:translate(var(--dx),var(--dy));opacity:0}}
.gel{display:flex;flex-direction:column;gap:9px;background:#214a36;padding:18px 22px;border-radius:14px;box-shadow:0 16px 40px rgba(0,0,0,.3)}
.blot-scene{display:flex;flex-direction:column;align-items:center;gap:10px;background:var(--paper);padding:16px;border-radius:16px;box-shadow:0 16px 40px rgba(0,0,0,.25)}
.blot-cap{font-family:Fredoka;font-size:18px;font-weight:600;color:var(--green-d)}
.amp-cont{position:fixed;inset:0;z-index:401;pointer-events:none;transition:opacity .6s ease}
.amp-cont.amp-out{opacity:0}
.amp-dino{position:fixed;opacity:0;animation:ampIn .42s ease forwards}
@keyframes ampIn{from{opacity:0;transform:scale(.35)}to{opacity:1;transform:scale(1)}}
.disco{display:flex;flex-direction:column;align-items:center;gap:12px}
.disco-ball{font-size:54px;animation:discoBob .5s ease-in-out infinite}
.disco-dinos{display:flex;gap:16px}
.disco-dinos span{width:66px;height:66px;display:block;animation:discoJump .5s ease-in-out infinite}
.disco-dinos span:nth-child(2){animation-delay:.16s}
.disco-dinos span:nth-child(3){animation-delay:.32s}
@keyframes discoJump{0%,100%{transform:translateY(0)}50%{transform:translateY(-18px)}}
@keyframes discoBob{0%,100%{transform:translateY(-5px) rotate(-8deg)}50%{transform:translateY(5px) rotate(8deg)}}
.hi-scene{display:flex;align-items:center;gap:16px}
.hi-dino{width:96px;height:96px;display:block;animation:hiWave .5s ease-in-out infinite;transform-origin:50% 90%}
.hi-text{font-family:Fredoka;font-size:64px;font-weight:600;color:var(--green-d)}
@keyframes hiWave{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
.apex{display:flex;flex-direction:column;align-items:center;gap:8px}
.apex-dino{width:130px;height:130px;display:block}
.apex-text{font-family:Fredoka;font-size:44px;font-weight:700;color:var(--coral);letter-spacing:1px}
.wave-sweep{position:fixed;bottom:0;left:-40%;width:55%;height:130px;background:linear-gradient(180deg,rgba(84,182,230,0),rgba(84,182,230,.55));border-radius:50% 50% 0 0;z-index:399;pointer-events:none;animation:waveMove 3.7s linear forwards}
@keyframes waveMove{from{left:-45%}to{left:120%}}
.surf-dino{position:fixed;bottom:74px;left:-60px;width:62px;height:62px;z-index:400;cursor:pointer;pointer-events:auto;animation:surfMove 3.8s linear forwards}
@keyframes surfMove{0%{left:-60px;bottom:74px}25%{bottom:100px}50%{bottom:80px}75%{bottom:104px}100%{left:110vw;bottom:74px}}
.wish-star{position:fixed;font-size:42px;z-index:600;cursor:pointer;pointer-events:auto;filter:drop-shadow(0 0 9px var(--sun));animation:wishFly 2.6s linear forwards}
@keyframes wishFly{0%{top:-44px;left:80vw;opacity:0}10%{opacity:1}100%{top:92vh;left:8vw;opacity:1}}
/* game extras */
.fd-dino{position:absolute;width:58px;height:58px;cursor:pointer;animation:fdPop .18s ease}
.fd-dino.fd-pop{animation:ecPop .15s ease forwards}
@keyframes fdPop{from{transform:scale(.2)}to{transform:scale(1)}}
.rl-wait{background:#f2d4ce!important}.rl-go{background:#bfeccf!important}.rl-soon{background:#ffd6c9!important}.rl-done{background:#d6edfb!important}
.rl-msg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:Fredoka;font-size:32px;font-weight:600;color:var(--ink);text-align:center;line-height:1.2}
.ht-egg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:96px;height:96px;cursor:pointer;z-index:2}
.ht-egg-inner{width:100%;height:100%;transition:transform .06s}
/* golden dino award */
.egg-badge-gold{background:linear-gradient(180deg,#ffe6a1,#f0c45a)!important;color:#7a5512!important;border-color:#e0b84a!important;box-shadow:0 2px 8px rgba(224,169,46,.4)}
.award-scene{position:fixed;inset:0;z-index:650;display:flex;align-items:center;justify-content:center;pointer-events:none;background:radial-gradient(circle at 50% 42%,rgba(255,210,80,.20),rgba(20,18,30,.5));animation:awardFade .5s ease}
.award-card{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;animation:awardPop .6s cubic-bezier(.2,1.2,.4,1)}
.award-spot{position:absolute;top:-30px;width:240px;height:360px;background:linear-gradient(180deg,rgba(255,228,140,.55),rgba(255,228,140,0));clip-path:polygon(40% 0,60% 0,100% 100%,0 100%);filter:blur(5px);z-index:-1}
.award-dino{width:150px;height:150px;filter:drop-shadow(0 8px 16px rgba(180,130,0,.55));animation:awardShine 2s ease-in-out infinite}
.award-pedestal{width:120px;height:26px;border-radius:8px;background:linear-gradient(180deg,#d4ad4d,#9c7c2e);box-shadow:0 10px 18px rgba(0,0,0,.35);margin-top:-8px}
.award-title{font-family:Fredoka;font-size:30px;font-weight:700;color:#FFD24A;text-shadow:0 2px 6px rgba(0,0,0,.4);margin-top:12px;letter-spacing:.5px}
.award-sub{font-weight:800;color:var(--paper);background:rgba(0,0,0,.4);padding:5px 14px;border-radius:999px;margin-top:4px}
@keyframes awardPop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes awardFade{from{opacity:0}to{opacity:1}}
@keyframes awardShine{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.award-banner{display:flex;align-items:center;gap:12px;background:linear-gradient(180deg,#fff6df,#ffedc2);border:1.5px solid #e9cd84;border-radius:14px;padding:12px 14px;margin-bottom:10px}
.award-banner .aw-dino{width:46px;height:46px;flex:none}
@media(max-width:560px){.rep-row{grid-template-columns:1fr auto;gap:6px}.rep-track{display:none}}

/* ---------- guided tour (per-tab walkthrough) ---------- */
.tour-overlay{position:fixed;inset:0;z-index:900;display:none}
.tour-spot{position:fixed;border-radius:10px;box-shadow:0 0 0 9999px rgba(20,18,30,.55);
  border:2px solid var(--sun,#FFC53D);transition:top .25s ease,left .25s ease,width .25s ease,height .25s ease;pointer-events:none}
.tour-pop{position:fixed;background:var(--paper,#fff);border-radius:14px;padding:16px;box-shadow:0 14px 34px rgba(0,0,0,.28);
  transition:top .25s ease,left .25s ease;max-width:360px}
.tour-pop-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.tour-pop-head b{font-family:Fredoka;font-size:16px}
.tour-pop-body{font-size:14px;line-height:1.45;color:var(--muted)}
.tour-pop-actions{display:flex;align-items:center;gap:8px;margin-top:14px}

<body>

<div class="app">
  <!-- ============ SIDEBAR ============ -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <span class="logo floaty" id="brandDino"></span>
      <span class="word">Lab Bench<small>Lab HQ</small></span>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <div class="lab-name" id="footLab">Your Lab</div>
      <div class="mgr" id="footMgr">Lab manager</div>
      <div class="dino-scene"><span class="walk-dino" id="walker"></span></div>
      <div class="egg-badge" id="eggBadge" title="Easter eggs found, tap to view" onclick="openEggCollection()">🥚 0/0</div>
      <div class="who" id="footUser" style="display:none"></div>
      <button class="btn ghost sm signout" id="signoutBtn" style="display:none" onclick="signOut()">Sign out</button>
    </div>
  </aside>

          id text primary key,
          kind text not null,
          data jsonb not null default '{}'::jsonb
        );
        alter table items enable row level security;
        create policy "lab members read" on items for select to authenticated using (true);

/* ---------- default seed data ---------- */
function seed(){
  // A brand-new install starts empty on purpose: no demo vendors, orders, inventory,
  // events, or jobs. Every lab's vendor list and ordering setup looks different, so it is safer to let people
  // add their own.
  // These four lists are just starting options for dropdowns, not records, so they
  // stay populated. Edit them here, or from Settings once the app is running.
  const orderCats=['Cell Culture','Antibodies','Drugs & Compounds','Mouse Supplies','Reagents & Chemicals','Plasticware & Consumables','Kits','Equipment','Office & General'];
  const locs=['−80 °C Freezer','−20 °C Freezer','4 °C Fridge','Liquid N₂','Room Temp Shelf','Chemical Cabinet','Cold Room','Mouse Facility'];
  const members=['Lab Manager','Grad Student','Postdoc','Research Tech','Rotating Student'];
  const evTypes=['Seminar','Talk','Journal Club','Conference','Workshop','Lab Social'];
  return {
    settings:{
      labName:'Your Lab', managerName:'Lab Manager', managerEmail:'', labEmails:'',
      UniversityOrderPortalName:'', UniversityOrderPortalUrl:'',
      digestDays:[4], digestEnabled:true, lastDigest:'',
      backupReminderEnabled:true, backupReminderDay:1, lastBackupReminder:'',
      statusSubscribers:[],
      notifyChannel:'email', slackWebhook:'',
      emailMode:'mailto', ejs:{user:'',service:'',template:''},
      orderCats, locs, members, evTypes,
      created:new Date().toISOString()
    },
    vendors:[], orders:[], inventory:[], events:[], jobs:[], todos:[],
    notices:[], comments:[],
    activity:[{id:uid(),ts:new Date().toISOString(),who:'Lab Bench',action:'created',entity:'lab',text:'Welcome to Lab Bench. Add your vendors, then start logging orders and inventory. Categories, locations, and lab members can be edited in Settings.'}]
  };
}

/* ---------- trusted admins ----------
   These accounts are allowed to clear all data or reset everything.
   isAdmin() below checks the signed-in Supabase Auth email — never a typed name —
   against two things: this fixed list (for accounts that should always have it,
   regardless of who's currently lab manager), plus whatever email is currently set
   as "Lab manager email" in Settings (so admin access follows the role automatically
   as managers change, with no code edit needed).
   This list is not shown anywhere in the app UI. Edit the source file and redeploy to change it. */
const TRUSTED_ADMIN_EMAILS = [
  // add your own email here, e.g. 'you@your-lab.edu'
];

/* ---------- store (Supabase shared, with localStorage fallback) ---------- */
const KEY='labbench_v1';
const ME_KEY='labbench_me';
const KINDS=['vendors','orders','inventory','events','notices','comments','activity','jobs','todos'];
const sb = (SUPA_URL && SUPA_KEY && window.supabase) ? window.supabase.createClient(SUPA_URL, SUPA_KEY) : null;
const CLOUD = !!sb;
let S; // state
let _snap = {};        // id -> JSON of last-persisted row (for diffing)
let _snapSettings='';  // JSON of last-persisted settings
let _syncing=false, _dirty=false;
let _pendingReload=false;

function whoAmI(){ try{ return localStorage.getItem(ME_KEY)||''; }catch(e){ return ''; } }
function setMe(name){ try{ localStorage.setItem(ME_KEY, name||''); }catch(e){} }
function nameFromEmail(email){
  if(!email) return '';
  const local=String(email).split('@')[0];
  return local.split(/[._\-+]+/).filter(Boolean).map(p=>p.charAt(0).toUpperCase()+p.slice(1).toLowerCase()).join(' ');
}
function currentUserName(){
  const me=whoAmI(); if(me) return me;
  const email=(CLOUD && _session && _session.user)? (_session.user.email||'') : '';
  const derived=nameFromEmail(email); if(!derived) return '';
  const mem=(S&&S.settings&&S.settings.members)||[];
  const lc=derived.toLowerCase(), first=lc.split(' ')[0];
  return mem.find(m=>m.toLowerCase()===lc) || mem.find(m=>m.toLowerCase().startsWith(first+' ')) || mem.find(m=>m.toLowerCase()===first) || derived;
}

function patch(){ // make sure new fields / arrays exist
  const d=seed();
  S.settings=Object.assign({},d.settings,S.settings);
  if(!S.settings.ejs) S.settings.ejs=d.settings.ejs;
  KINDS.forEach(k=>{ if(!Array.isArray(S[k])) S[k]=[]; });
}
function snapshot(){
  _snap={};
  KINDS.forEach(k=> (S[k]||[]).forEach(r=>{ if(r&&r.id) _snap[r.id]=JSON.stringify(r); }));
  _snapSettings=JSON.stringify(S.settings);
}

async function load(){
  if(CLOUD){
    try{
      const rows = await fetchAll();
      if(!rows.length){ S=seed(); snapshotEmpty(); await pushAll(); return; }
      bucket(rows);
      patch();
      snapshot();
      return;
    }catch(e){ console.error(e); toast('Could not reach Supabase. Using this browser only.','warn'); }
  }
  // local fallback
  try{ const raw=localStorage.getItem(KEY); if(raw){ S=JSON.parse(raw); patch(); return; } }catch(e){}
  S=seed(); saveLocal();
}
async function fetchAll(){
  let out=[], from=0, page=1000;
  while(true){
    const { data, error } = await sb.from('items').select('id,kind,data').range(from, from+page-1);
    if(error) throw error;
    out=out.concat(data||[]);
    if(!data || data.length<page) break;
    from+=page;
  }
  return out;
}
function bucket(rows){
  const fresh=seed(); KINDS.forEach(k=> fresh[k]=[]);
  rows.forEach(r=>{
    if(r.kind==='settings'){ fresh.settings=Object.assign({},fresh.settings,r.data); return; }
    if(KINDS.includes(r.kind)){ const row=Object.assign({},r.data,{id:r.id}); fresh[r.kind].push(row); }
  });
  // keep activity newest first
  fresh.activity.sort((a,b)=>(b.ts||'').localeCompare(a.ts||''));
  S=fresh;
}
function snapshotEmpty(){ _snap={}; _snapSettings=''; }

const CHUNK=500;
async function upsertChunked(rows){
  for(let i=0;i<rows.length;i+=CHUNK){
    const { error } = await sb.from('items').upsert(rows.slice(i,i+CHUNK));
    if(error) throw error;
  }
}
async function deleteChunked(ids){
  for(let i=0;i<ids.length;i+=CHUNK){
    const { error } = await sb.from('items').delete().in('id', ids.slice(i,i+CHUNK));
    if(error) throw error;
  }
}
async function pushAll(){
  const ups=[];
  KINDS.forEach(k=> (S[k]||[]).forEach(r=> ups.push({id:r.id, kind:k, data:stripId(r)})));
  ups.push({id:'settings', kind:'settings', data:S.settings});
  try{ await upsertChunked(ups); snapshot(); }
  catch(e){ console.error(e); toast('Could not write to Supabase.','warn'); }
}
function stripId(r){ const o=Object.assign({},r); delete o.id; return o; }

function save(){ if(CLOUD){ scheduleSync(); } else { saveLocal(); } }
function saveNow(){ if(CLOUD){ _dirty=true; clearTimeout(_syncTimer); cloudSync(); } else { saveLocal(); } }
function saveLocal(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){ toast('Could not save. Storage may be full.','warn'); } }

let _syncTimer=null;
function scheduleSync(){ _dirty=true; clearTimeout(_syncTimer); _syncTimer=setTimeout(cloudSync,250); }
async function cloudSync(){
  if(!CLOUD) return;
  if(_syncing){ _dirty=true; return; }
  _syncing=true; _dirty=false;
  try{
    const ups=[], seenIds=new Set();
    KINDS.forEach(k=> (S[k]||[]).forEach(r=>{
      if(!r||!r.id) return; seenIds.add(r.id);
      const j=JSON.stringify(r);
      if(_snap[r.id]!==j) ups.push({id:r.id, kind:k, data:stripId(r)});
    }));
    if(_snapSettings!==JSON.stringify(S.settings)) ups.push({id:'settings', kind:'settings', data:S.settings});
    const delIds=Object.keys(_snap).filter(id=>!seenIds.has(id));
    if(ups.length) await upsertChunked(ups);
    if(delIds.length) await deleteChunked(delIds);
    snapshot();
  }catch(e){ console.error(e); toast('Sync hiccup. Will retry on next change.','warn'); }
  _syncing=false;
  if(_dirty) scheduleSync();
}

/* realtime: when anyone changes data, refresh quietly */
function subscribeRealtime(){
  if(!CLOUD) return;
  sb.channel('items-rt')
    .on('postgres_changes',{event:'*',schema:'public',table:'items'},()=>scheduleReload())
    .subscribe();
}
let _reloadTimer=null;
function scheduleReload(){ clearTimeout(_reloadTimer); _reloadTimer=setTimeout(reloadFromCloud,400); }
async function reloadFromCloud(){
  // Never overwrite local state while we have unsaved edits or a sync in flight —
  // otherwise a refresh from another device can revert a change before it's written.
  if(!CLOUD || _syncing || _dirty){ scheduleReload(); return; }
  try{
    const rows=await fetchAll();
    const before=JSON.stringify(KINDS.map(k=>S[k]))+JSON.stringify(S.settings);
    bucket(rows); patch();
    const after=JSON.stringify(KINDS.map(k=>S[k]))+JSON.stringify(S.settings);
    snapshot();
    if(before!==after){
      applyChrome(); buildNav();
      if($('#modalBg').classList.contains('show')) _pendingReload=true;
      else rerenderActive();
    }
  }catch(e){ console.error(e); }
}

const JOB_FREQS=['Weekly','Every other week','Monthly','Every 3 months','Every 6 months','As needed'];
function jobIntervalDays(freq){
  const f=(freq||'').trim().toLowerCase();
  if(!f || f.includes('as needed')) return null;
  if(f.includes('other week') || f.includes('biweek')) return 14;
  if(f.includes('3 month') || f.includes('quarter')) return 90;
  if(f.includes('6 month')) return 180;
  if(f.includes('week')) return 7;
  if(f.includes('month')) return 30;
  return null;
}
function jobDue(j){
  const iv=jobIntervalDays(j.frequency);
  if(iv==null) return false;
  if(!j.lastDoneAt) return true;
  return (Date.now()-j.lastDoneAt) >= iv*86400000;
}
function jobStatusText(j){
  if(!j.lastDoneAt) return jobIntervalDays(j.frequency)==null? 'Not done yet' : 'Never marked done, due now';
  const iv=jobIntervalDays(j.frequency);
  const doneAgo=fmtAgo(new Date(j.lastDoneAt).toISOString());
  if(iv==null) return `Last done ${doneAgo}`;
  const nextDue=j.lastDoneAt+iv*86400000;
  const daysLeft=Math.ceil((nextDue-Date.now())/86400000);
  if(daysLeft<=0) return `Last done ${doneAgo}, due now`;
  return `Last done ${doneAgo}, due in ${daysLeft} day${daysLeft===1?'':'s'}`;
}

function saveJob(id){
  const title=$('#j_title').value.trim(); if(!title){ toast('Give the job a name','warn'); return; }
  const assignees=[...document.getElementById('j_assignees').selectedOptions].map(o=>o.value).filter(Boolean);
  const wasAttn=id? (S.jobs.find(x=>x.id===id)||{}).needsAttention : false;

  const attentionNote=$('#j_attnnote')?.value.trim()||'';
  const data={title,frequency:$('#j_freq').value,assignees,notes:$('#j_notes').value.trim(),needsAttention,attentionNote};
  let job;
  if(id){ job=S.jobs.find(x=>x.id===id); Object.assign(job,data); log('updated','job',job.title); }

  if(needsAttention && !wasAttn){

      ${col('Your open requests', myRequests.length? myRequests.slice(0,4).map(o=>row(esc(o.item))).join('') : `<div class="tiny muted" style="margin-top:6px">Nothing waiting on you.</div>`)}
      <div>
        <div class="tiny muted" style="font-weight:800;text-transform:uppercase;letter-spacing:.03em">Your to-do list</div>
        <div class="row" style="margin-top:6px">
          <input id="todoInput" placeholder="Add something for today…" onkeydown="if(event.key==='Enter')addTodo()" style="flex:1">
          <button class="btn ghost sm" onclick="addTodo()">Add</button>
        </div>
        <div style="margin-top:8px;max-height:120px;overflow-y:auto">
          ${open.length? open.map(i=>`<label class="check" style="display:flex;gap:6px;align-items:center"><input type="checkbox" onchange="toggleTodo('${i.id}')"> <span style="flex:1">${esc(i.text)}</span><button class="btn icon ghost sm" onclick="deleteTodo('${i.id}')">×</button></label>`).join('') : `<div class="tiny muted">Nothing yet. Anything you don't check off carries over.</div>`}
          ${done.length? `<div class="tiny muted" style="margin-top:6px">${done.length} done</div>`:''}
        </div>
      </div>
    </div>
  </div>`;
}

const TOUR_SEQUENCE=TABS.map(t=>t.id);
let _tour=null;
function tourEnterTab(tabId){
  if(active!==tabId) navigate(tabId);
  _tour.tab=tabId;
  _tour.steps=(TOURS[tabId]||[]).slice();
  _tour.stepI=0;
  if(!_tour.steps.length){ tourFinishTab(); return; }
  setTimeout(tourPlaceStep,320);
}
function startFullTour(){
  _tour={running:true, chain:true, seq:TOUR_SEQUENCE.slice(), seqIdx:0, tab:null, steps:[], stepI:0};
  tourEnterTab(_tour.seq[0]);
}
function startTabTour(tabId){
  const wasOnTab=(active===tabId);
  _tour={running:true, chain:false, seq:[tabId], seqIdx:0, tab:null, steps:[], stepI:0};
  if(wasOnTab) tourEnterTab(tabId);
  else setTimeout(()=>tourEnterTab(tabId),350);
}
function tourPlaceStep(){
  const st=_tour; if(!st||!st.running) return;
  const step=st.steps[st.stepI];
  if(!step){ tourFinishTab(); return; }
  const el=document.querySelector(step.sel);
  if(!el){ tourNext(); return; }   // nothing to point at right now, so just skip it
  const ov=document.getElementById('tourOverlay');
  ov.style.display='block';
  ov.innerHTML=`<div class="tour-spot" id="tourSpot"></div><div class="tour-pop" id="tourPop"></div>`;
  const pop=document.getElementById('tourPop');
  const last=st.stepI===st.steps.length-1;
  const isLastTabInChain = st.chain && st.seqIdx===st.seq.length-1;
  const nextLabel = !last ? 'Next ›'
    : (st.chain && !isLastTabInChain) ? `Next: ${(TABS.find(t=>t.id===st.seq[st.seqIdx+1])||{}).label||'next'} tour →`
    : (st.chain ? 'Finish' : 'Got it');
  pop.innerHTML=`
    <div class="tour-pop-head"><b>${esc(step.title)}</b><span class="tiny muted">${st.stepI+1} / ${st.steps.length}</span></div>
    <div class="tour-pop-body">${esc(step.body)}</div>
    <div class="tour-pop-actions">
      <button class="btn ghost sm" onclick="tourSkip()">Skip tour</button>
      <span class="spacer"></span>
      ${st.stepI>0?`<button class="btn ghost sm" onclick="tourBack()">‹ Back</button>`:''}
      <button class="btn primary sm" onclick="tourNext()">${nextLabel}</button>
    </div>`;
  if(el.scrollIntoView) el.scrollIntoView({block:'center',behavior:'smooth'});
  setTimeout(()=>tourPositionAround(el),260);
  window.addEventListener('resize',tourReposition);
}
function tourPositionAround(el){
  const spot=document.getElementById('tourSpot'), pop=document.getElementById('tourPop');
  if(!spot||!pop) return;
  const r=el.getBoundingClientRect(), pad=6;
  spot.style.left=(r.left-pad)+'px'; spot.style.top=(r.top-pad)+'px';
  spot.style.width=(r.width+pad*2)+'px'; spot.style.height=(r.height+pad*2)+'px';
  const popW=Math.min(340,window.innerWidth-24);
  pop.style.width=popW+'px';
  let top=r.bottom+14;
  if(top+180>window.innerHeight) top=Math.max(10,r.top-14-(pop.offsetHeight||160));
  const left=Math.min(Math.max(10,r.left),window.innerWidth-popW-10);
  pop.style.top=top+'px'; pop.style.left=left+'px';
}
function tourReposition(){ const st=_tour; if(!st||!st.running) return; const step=st.steps[st.stepI]; const el=step&&document.querySelector(step.sel); if(el) tourPositionAround(el); }
function tourNext(){ const st=_tour; if(!st||!st.running) return; st.stepI++; if(st.stepI>=st.steps.length){ tourFinishTab(); return; } tourPlaceStep(); }
function tourBack(){ const st=_tour; if(!st||!st.running||st.stepI<=0) return; st.stepI--; tourPlaceStep(); }
function tourFinishTab(){
  const st=_tour; if(!st) return;
  if(st.chain){
    st.seqIdx++;
    if(st.seqIdx<st.seq.length){ tourEnterTab(st.seq[st.seqIdx]); return; }
    setTourDone(); tourClose();
    toast('That’s the full tour 🦕 Replay any tab from Settings > Help & tours.','good');
    return;
  }
  tourClose();
}
function tourSkip(){ const st=_tour; if(!st) return; if(st.chain) setTourDone(); tourClose(); }
function tourClose(){
  _tour=null;
  const ov=document.getElementById('tourOverlay');
  if(ov){ ov.style.display='none'; ov.innerHTML=''; }
  window.removeEventListener('resize',tourReposition);
}

function currentOrderList(){
  let list=S.orders.slice();
  if(orderFilter.status) list=list.filter(o=>o.status===orderFilter.status);
  if(orderFilter.cat) list=list.filter(o=>o.cat===orderFilter.cat);
  if(orderFilter.q){ const q=orderFilter.q.toLowerCase(); list=list.filter(o=>[o.item,o.catalog,vendorName(o.vendor),o.reqBy].some(v=>(v||'').toLowerCase().includes(q))); }
  return list;
}
function statusControl(o){
  const opts=[['requested','Requested'],['approved','Approved'],['ordered','Ordered'],['backordered','Backordered'],['received','Received'],['cancelled','Cancelled']];
  return `<select class="status-select ${o.status}" onchange="setStatus('${o.id}',this.value)" aria-label="Order status">
    ${opts.map(([v,l])=>`<option value="${v}" ${o.status===v?'selected':''}>${l}</option>`).join('')}
  </select>`;
}
function setStatus(id,st){
  const o=S.orders.find(x=>x.id===id); if(!o)return;
  const prev=o.status; if(prev===st){ return; }
  o.status=st; if(st==='received')o.urgent=false;
  saveNow(); log('updated','order',`${o.item} → ${st}`); renderOrders(); buildNav();
  notifyStatusSubscribers(o,prev,st);
  if(st==='received' && prev!=='received'){ offerAddToInventory(id); }
  else { toast('Order set to '+st, st==='cancelled'||st==='backordered'?'warn':'good'); }
  if(prev==='requested' && st!=='requested' && !S.orders.some(o=>o.status==='requested')) setTimeout(celebrateCaughtUp,300);
}
function offerAddToInventory(id){
  const o=S.orders.find(x=>x.id===id); if(!o)return;
  toast('Order marked received','good');
  const prefill={ item:o.item, cat:o.cat||S.settings.orderCats[0], loc:S.settings.locs[0]||'',
    qty:Number(o.qty)||1, unitLabel:'units', min:0, vendor:o.vendor||'', catalog:o.catalog||'', lot:'', exp:'', note:o.note||'' };
  inventoryForm(null, prefill, 'received');
}

function resolveVendorByName(name){
  name=(name||'').trim(); if(!name) return '';
  const lc=name.toLowerCase();
  const existing=S.vendors.find(v=>(v.name||'').trim().toLowerCase()===lc);
  if(existing) return existing.id;
  const v={id:uid(),name,type:'external',url:'',contact:'',email:'',note:'',cat:''};
  S.vendors.push(v); log('added','vendor',`${name} (auto-added from order)`);
  return v.id;
}
function saveOrder(id){
  const item=$('#o_item').value.trim(); if(!item){ toast('Give the item a name','warn'); return; }
  const vendorId=resolveVendorByName($('#o_vendor').value);
  const data={item,cat:$('#o_cat').value,vendor:vendorId,catalog:$('#o_cat\\#').value.trim(),
    qty:Number($('#o_qty').value)||1,unit:Number($('#o_unit').value)||0,unitSize:$('#o_unitsize').value.trim(),reqBy:$('#o_req').value,
    fund:$('#o_fund').value.trim(),reqId:$('#o_reqid').value.trim(),po:$('#o_po').value.trim(),quote:$('#o_quote').value.trim(),note:$('#o_note').value.trim(),urgent:$('#o_urgent').checked};
  if(id){ const o=S.orders.find(x=>x.id===id); Object.assign(o,data); log('updated','order',o.item); }
  else { const o=Object.assign({id:uid(),date:todayKey(),status:'requested'},data); S.orders.unshift(o); log('requested','order',o.item,o.reqBy); id=o.id; }
  saveNow(); closeModal(); renderOrders(); buildNav();

}
function flagUrgentSilent(o){

function deleteOrder(id){ const o=S.orders.find(x=>x.id===id); if(!confirm('Delete this order?'))return; S.orders=S.orders.filter(x=>x.id!==id); saveNow(); log('deleted','order',o?o.item:''); closeModal(); renderOrders(); buildNav(); toast('Order deleted'); }

function renderInventory(){

function renderInvBody(){
  const list=invFiltered();
  const total=list.length;
  const pages=Math.max(1,Math.ceil(total/INV_PAGE));
  if(invPage>pages) invPage=pages; if(invPage<1) invPage=1;
  const start=(invPage-1)*INV_PAGE, slice=list.slice(start,start+INV_PAGE);
  let html;
  if(!total){ html=emptyState(DINO.stego(),'Nothing matches','Try a different search, or add a new item.'); }
  else{
    html=`<div class="tablewrap"><table><thead><tr>
      <th>Item</th><th>Location</th><th>Stock</th><th>Expiry</th><th>Vendor</th><th></th></tr></thead><tbody>`;
    slice.forEach(i=>{
      const lowFlag=Number(i.min)>0 && Number(i.qty)<=Number(i.min);
      const dU=daysUntil(i.exp);
      let expCell='<span class="muted tiny">—</span>';
      if(i.exp){ expCell=`${fmtDate(i.exp)} ${dU<=0?'<span class="pill exp">expired</span>':dU<=30?`<span class="pill exp">${dU}d</span>`:''}`; }
      html+=`<tr>
        <td><div class="strong">${esc(i.item)}</div><div class="sub">${esc(i.cat)} ${i.catalog?('· #'+esc(i.catalog)):''} ${i.lot?('· lot '+esc(i.lot)):''}</div></td>
        <td>${esc(i.loc)||'<span class="muted">—</span>'}${i.box?`<div class="tiny muted">${esc(i.box)}</div>`:''}</td>
        <td><span class="strong">${esc(i.qty)}</span> <span class="tiny muted">${esc(i.unitLabel||'')}</span> ${lowFlag?'<span class="pill low">low</span>':'<span class="pill ok">ok</span>'}</td>
        <td>${expCell}</td>
        <td>${vendorName(i.vendor)?esc(vendorName(i.vendor)):'<span class="muted tiny">—</span>'}</td>
        <td><div class="rowact">
          <button class="btn sm primary" onclick="reorderFromInv('${i.id}')">Reorder</button>
          ${threadBtn('inventory',i.id)}
          <button class="btn icon ghost sm" onclick="inventoryForm('${i.id}')">✎</button>
        </div></td></tr>`;
    });
    html+=`</tbody></table></div>`;
    html+=pager(total,pages,start,slice.length);

function saveInv(id){
  const item=$('#i_item').value.trim(); if(!item){toast('Give the item a name','warn');return;}
  const data={item,cat:$('#i_cat').value,loc:$('#i_loc').value,box:$('#i_box').value.trim(),qty:Number($('#i_qty').value)||0,unitLabel:$('#i_unit').value.trim(),min:Number($('#i_min').value)||0,vendor:$('#i_vendor').value,catalog:$('#i_cat\\#').value.trim(),lot:$('#i_lot').value.trim(),exp:$('#i_exp').value,note:$('#i_note').value.trim()};
  if(id){const i=S.inventory.find(x=>x.id===id);Object.assign(i,data);log('updated','inventory',i.item);}
  else{
    const dup=findInvDuplicate(data,null);
    if(dup){ _pendingInv=data; confirmInvDup(dup,data); return; }
    S.inventory.unshift(Object.assign({id:uid()},data));log('added','inventory',item);
  }
  saveNow(); closeModal(); renderInvBody(); toast('Inventory saved 🦕','good');
}
function invKey(it){ return (it.item||'').trim().toLowerCase().replace(/\s+/g,' '); }
function findInvDuplicate(data, excludeId){
  const name=invKey(data); if(!name) return null;
  const cat=(data.catalog||'').trim().toLowerCase(), ven=(data.vendor||'');
  return S.inventory.find(i=> i.id!==excludeId && invKey(i)===name && (
     (cat && (i.catalog||'').trim().toLowerCase()===cat) || (ven && i.vendor===ven)
  )) || null;
}
let _pendingInv=null;
function confirmInvDup(existing, data){
  const vn=vendorName(existing.vendor)||'no vendor';

function mergeIntoInv(id){
  const it=S.inventory.find(x=>x.id===id), d=_pendingInv;
  if(it&&d){ it.qty=(Number(it.qty)||0)+(Number(d.qty)||0); if(d.lot)it.lot=d.lot; if(d.exp)it.exp=d.exp; if(d.note&&!it.note)it.note=d.note; it.received=todayKey(); log('updated','inventory',`${it.item} +${d.qty} (added to existing)`); }
  _pendingInv=null; saveNow(); closeModal(); renderInvBody(); toast('Added to existing item 🦕','good');
}
function forceCreateInv(){
  const d=_pendingInv; _pendingInv=null;
  if(d){ S.inventory.unshift(Object.assign({id:uid()},d)); log('added','inventory',d.item); saveNow(); }
  closeModal(); renderInvBody(); toast('Created a separate entry','good');
}
function deleteInv(id){ const i=S.inventory.find(x=>x.id===id); if(!confirm('Delete this item?'))return; S.inventory=S.inventory.filter(x=>x.id!==id); saveNow(); log('deleted','inventory',i?i.item:''); closeModal(); renderInvBody(); toast('Item deleted'); }

/* ---------- duplicate detection (inventory + vendors) ---------- */
function normName(s){ return (s||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim(); }
function dupIgnored(){ return new Set(S.settings.dupeIgnore||[]); }
function invDupGroups(){
  const ignore=dupIgnored(), groups=[];
  const byName=new Map();
  for(const it of S.inventory){ const na=invKey(it); if(!na)continue; let a=byName.get(na); if(!a){a=[];byName.set(na,a);} a.push(it); }
  for(const arr of byName.values()){ if(arr.length<2)continue;
    const used=new Set();
    for(let i=0;i<arr.length;i++){ const a=arr[i]; if(used.has(a.id))continue; const grp=[a];
      for(let j=i+1;j<arr.length;j++){ const b=arr[j]; if(used.has(b.id))continue;
        // strong duplicate: same name AND same catalog number (both present)
        if(a.catalog&&b.catalog&&normName(a.catalog)===normName(b.catalog)) grp.push(b);
      }
      if(grp.length>1){ const key='inv:'+grp.map(x=>x.id).sort().join('|'); if(!ignore.has(key)){ grp.forEach(x=>used.add(x.id)); groups.push({type:'inv',key,items:grp}); } }
    }
  }
  return groups;
}
function vendorDupGroups(){
  const ignore=dupIgnored(), groups=[], seen=new Set();
  for(let i=0;i<S.vendors.length;i++){
    const a=S.vendors[i]; if(seen.has(a.id))continue; const na=normName(a.name); if(!na)continue;
    const grp=[a];
    for(let j=i+1;j<S.vendors.length;j++){ const b=S.vendors[j]; if(seen.has(b.id))continue; const nb=normName(b.name);
      if(nb===na || (na.length>4&&nb.length>4&&(na.includes(nb)||nb.includes(na)))) grp.push(b);
    }
    if(grp.length>1){ const key='ven:'+grp.map(x=>x.id).sort().join('|'); if(!ignore.has(key)){ grp.forEach(x=>seen.add(x.id)); groups.push({type:'ven',key,items:grp}); } }
  }
  return groups;
}
function dupCount(){ return invDupGroups().length + vendorDupGroups().length; }
function openDupReview(){
  const all=[...invDupGroups(), ...vendorDupGroups()];
  const groups=all.slice(0,60);
  const more=all.length-groups.length;
  const body = all.length ? groups.map(dupGroupHTML).join('') + (more>0?`<p class="tiny muted" style="margin-top:10px">…and ${more} more group${more===1?'':'s'}. Resolve these first, then reopen to see the rest.</p>`:'') : '<p class="tiny muted">No possible duplicates right now. 🦕</p>';
  openModal(`<div class="modal-head"><span style="width:30px">${DINO.trike()}</span><h3>Possible duplicates${all.length?` (${all.length})`:''}</h3><button class="x" onclick="closeModal()">×</button></div>
    <div class="modal-body">${all.length?'<p class="tiny muted">These look similar. For each group you can merge them into one, delete an entry, or mark them as not a duplicate.</p>':''}${body}</div>
    <div class="modal-foot"><button class="btn primary" onclick="closeModal()">Done</button></div>`);
}
function dupGroupHTML(g){
  const rows=g.items.map(it=> g.type==='inv'
    ? `<div class="dup-row"><div><b>${esc(it.item)}</b><div class="tiny muted">${esc(vendorName(it.vendor)||'no vendor')}${it.catalog?' · '+esc(it.catalog):''} · ${it.qty} ${esc(it.unitLabel||'')}${it.loc?' · '+esc(it.loc):''}</div></div><button class="btn ghost sm" onclick="dupDeleteOne('inv','${it.id}')">Delete</button></div>`
    : `<div class="dup-row"><div><b>${esc(it.name)}</b><div class="tiny muted">${[it.contact,it.email,it.type].filter(Boolean).map(esc).join(' · ')||'no details'}</div></div><button class="btn ghost sm" onclick="dupDeleteOne('ven','${it.id}')">Delete</button></div>`
  ).join('');
  return `<div class="dup-group"><div class="dup-head">${g.type==='inv'?'📦 Inventory':'🏢 Vendor'} · ${g.items.length} similar</div>${rows}
    <div class="dup-actions"><button class="btn ghost sm" onclick="dupIgnore('${g.key}')">Not a duplicate</button><button class="btn primary sm" onclick="dupMerge('${g.type}','${g.key}')">Merge into one</button></div></div>`;
}
function dupIgnore(key){ S.settings.dupeIgnore=S.settings.dupeIgnore||[]; if(!S.settings.dupeIgnore.includes(key)) S.settings.dupeIgnore.push(key); saveNow(); if(active==='dashboard')renderDashboard(); openDupReview(); toast('Marked as not a duplicate','good'); }
function dupDeleteOne(type,id){
  if(!confirm('Delete this entry? This cannot be undone.'))return;
  if(type==='inv'){ const it=S.inventory.find(x=>x.id===id); S.inventory=S.inventory.filter(x=>x.id!==id); log('deleted','inventory',it?it.item:''); }
  else { const v=S.vendors.find(x=>x.id===id); S.vendors=S.vendors.filter(x=>x.id!==id); log('deleted','vendor',v?v.name:''); }
  saveNow(); if(active==='dashboard')renderDashboard(); openDupReview(); toast('Deleted');
}
function dupMerge(type,key){
  const ids=key.split(':')[1].split('|');
  if(type==='inv'){
    const items=ids.map(id=>S.inventory.find(x=>x.id===id)).filter(Boolean); if(items.length<2)return;
    const keep=items[0]; let total=0; items.forEach(it=>total+=Number(it.qty)||0); keep.qty=total;
    items.slice(1).forEach(it=>{ if(!keep.lot&&it.lot)keep.lot=it.lot; if(!keep.exp&&it.exp)keep.exp=it.exp; if(!keep.note&&it.note)keep.note=it.note; });
    const rm=items.slice(1).map(x=>x.id); S.inventory=S.inventory.filter(x=>!rm.includes(x.id));
    log('merged','inventory',`${keep.item} (${items.length} entries → 1)`);
  } else {
    const vends=ids.map(id=>S.vendors.find(x=>x.id===id)).filter(Boolean); if(vends.length<2)return;
    const keep=vends[0], rm=vends.slice(1).map(x=>x.id);
    S.inventory.forEach(i=>{ if(rm.includes(i.vendor)) i.vendor=keep.id; });
    S.orders.forEach(o=>{ if(rm.includes(o.vendor)) o.vendor=keep.id; });
    S.vendors=S.vendors.filter(x=>!rm.includes(x.id));
    log('merged','vendor',`${keep.name} (${vends.length} entries → 1)`);
  }
  saveNow(); if(active==='dashboard')renderDashboard(); openDupReview(); toast('Merged 🦕','good');
}

    html+=`<div class="card" style="${past?'opacity:.72':''}">

function evGoMonth(delta){ const d=evMonth||monthOfToday(); evMonth=new Date(d.getFullYear(), d.getMonth()+delta, 1); renderEvents(); }
function monthOfToday(){ const n=new Date(); return new Date(n.getFullYear(), n.getMonth(), 1); }
function pad2(n){ return String(n).padStart(2,'0'); }
function calendarHtml(){
  if(!evMonth) evMonth=monthOfToday();
  const y=evMonth.getFullYear(), m=evMonth.getMonth();
  const monthName=evMonth.toLocaleString('en-US',{month:'long',year:'numeric'});
  const first=new Date(y,m,1), startDow=first.getDay(), daysIn=new Date(y,m+1,0).getDate();
  const todayStr=todayKey();
  // bucket events by date string
  const byDate={};
  evFilteredAll().forEach(e=>{ if(e.date){ (byDate[e.date]=byDate[e.date]||[]).push(e); } });
  const dow=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  let cells='';
  for(let i=0;i<startDow;i++) cells+=`<div class="cal-cell empty"></div>`;
  for(let d=1; d<=daysIn; d++){
    const ds=`${y}-${pad2(m+1)}-${pad2(d)}`;
    const evs=(byDate[ds]||[]).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
    const chips=evs.map(e=>`<button class="cal-ev ${daysUntil(e.date)<0?'past':''}" title="${esc(e.title)}${e.time?(' · '+esc(e.time)):''}" onclick="eventForm('${e.id}')">${e.time?`<b>${esc(e.time)}</b> `:''}${esc(e.title)}</button>`).join('');
    cells+=`<div class="cal-cell ${ds===todayStr?'today':''}" ondblclick="newEventOn('${ds}')">
      <div class="cal-d">${d}</div>${chips}</div>`;
  }
  const trail=(7-((startDow+daysIn)%7))%7;
  for(let i=0;i<trail;i++) cells+=`<div class="cal-cell empty"></div>`;
  return `<div class="cal-wrap">
    <div class="cal-head">
      <button class="btn ghost sm" onclick="evGoMonth(-1)">‹</button>
      <div class="cal-title">${monthName}</div>
      <button class="btn ghost sm" onclick="evGoMonth(1)">›</button>
      <span class="spacer"></span>
      <button class="btn ghost sm" onclick="evMonth=monthOfToday();renderEvents()">Today</button>
    </div>
    <div class="cal-grid cal-dow">${dow.map(d=>`<div class="cal-dowcell">${d}</div>`).join('')}</div>
    <div class="cal-grid">${cells}</div>
    <p class="tiny muted" style="margin:10px 2px 0">Tap an event to edit it. Double-tap an empty day to add one.</p>
  </div>`;
}
